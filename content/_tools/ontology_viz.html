<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnatoLens Ontology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffc400'/%3E%3Cstop offset='.5' stop-color='%23e10600'/%3E%3Cstop offset='1' stop-color='%23111'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='url(%23g)' stroke-width='15'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fffbef; --bg2: #fff1e6; --surface: rgba(255,255,255,.82); --ink: #161210; --muted: #6e6560; --line: #eee2d2;
  --halo: #ffffff; --accent: #e10600; --accent2: #ffc400; --accent3: #111111; --accent2-ink: #b88600; --title-end: #111111;
  --rel-part_of: #2b2522; --rel-connects_to: #ff8a00; --rel-flows_to: #e10600; --rel-supplies: #d9a400;
  --rel-other: #8a5a44; --ok: #0f9d68; --warn: #e07b00;
  --blob1: #fff0b3; --blob2: #ffd9d2; --blob3: #ffe9b8; --dot: rgba(225,6,0,.12);
  --code-bg: #111111; --code-ink: #fff4d6; --shadow: rgba(60,10,0,.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0a09; --bg2: #170806; --surface: rgba(28,20,16,.8); --ink: #fff6e6; --muted: #b3a79a; --line: #3a2a20;
    --halo: #120c09; --accent: #ff2a1a; --accent2: #ffd000; --accent3: #000000; --accent2-ink: #ffd23f; --title-end: #ffd000;
    --rel-part_of: #a99f95; --rel-connects_to: #ffa31a; --rel-flows_to: #ff3b2f; --rel-supplies: #ffd000;
    --rel-other: #c08a6a; --ok: #4ee6a0; --warn: #ffb347;
    --blob1: rgba(255,196,0,.14); --blob2: rgba(225,6,0,.22); --blob3: rgba(255,120,0,.12); --dot: rgba(255,196,0,.13);
    --code-bg: #000000; --code-ink: #fff4d6; --shadow: rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #0c0a09; --bg2: #170806; --surface: rgba(28,20,16,.8); --ink: #fff6e6; --muted: #b3a79a; --line: #3a2a20;
  --halo: #120c09; --accent: #ff2a1a; --accent2: #ffd000; --accent3: #000000; --accent2-ink: #ffd23f; --title-end: #ffd000;
  --rel-part_of: #a99f95; --rel-connects_to: #ffa31a; --rel-flows_to: #ff3b2f; --rel-supplies: #ffd000;
  --rel-other: #c08a6a; --ok: #4ee6a0; --warn: #ffb347;
  --blob1: rgba(255,196,0,.14); --blob2: rgba(225,6,0,.22); --blob3: rgba(255,120,0,.12); --dot: rgba(255,196,0,.13);
  --code-bg: #000000; --code-ink: #fff4d6; --shadow: rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { color: var(--ink); font: 14px/1.5 "Plus Jakarta Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column;
       background:
         radial-gradient(42vw 42vw at 6% 10%, var(--blob1), transparent 70%),
         radial-gradient(46vw 46vw at 94% 18%, var(--blob2), transparent 70%),
         radial-gradient(55vw 42vw at 45% 108%, var(--blob3), transparent 70%),
         linear-gradient(160deg, var(--bg), var(--bg2));
       background-color: var(--bg); }
header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 16px; position: relative; z-index: 1;
         background: var(--surface); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
                background: linear-gradient(90deg, #ffc400, #e10600, #111111, #e10600, #ffc400);
                background-size: 200% 100%; animation: rainbow 10s linear infinite; }
@keyframes rainbow { to { background-position: 200% 0; } }
h1, aside h2, .stat b { font-family: "Space Grotesk", "Plus Jakarta Sans", "IBM Plex Sans Arabic", sans-serif; }
h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
h1 b { background: linear-gradient(90deg, var(--accent), var(--accent2) 55%, var(--title-end)); -webkit-background-clip: text;
       background-clip: text; color: transparent; }
h1 .sub { color: var(--muted); font-weight: 400; font-size: 13px; }
.logo { width: 26px; height: 26px; border-radius: 50%; flex: none; position: relative;
        background: conic-gradient(from 0deg, #ffc400, #e10600, #111111, #e10600, #ffc400);
        box-shadow: 0 0 14px rgba(225,6,0,.45); animation: spin 14s linear infinite; }
.logo::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--halo); }
@keyframes spin { to { transform: rotate(360deg); } }
.group { display: flex; gap: 4px; align-items: center; padding: 3px; border-radius: 999px; background: var(--surface);
         border: 1px solid var(--line); }
.group label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 0 4px 0 8px; }
button { font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: transparent; border: 1px solid transparent;
         border-radius: 999px; padding: 4px 12px; cursor: pointer; transition: background .2s, transform .15s, box-shadow .2s; }
button:hover { background: color-mix(in srgb, var(--accent2) 22%, transparent); }
button:active { transform: scale(.96); }
button[aria-pressed="true"] { background: linear-gradient(135deg, var(--accent3), var(--accent) 60%, var(--accent2)); color: #fff;
                              box-shadow: 0 3px 12px color-mix(in srgb, var(--accent) 40%, transparent); }
#relayout { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: #111; font-weight: 600; }
button:focus-visible, .node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; min-width: 0;
         background-image: radial-gradient(var(--dot) 1.3px, transparent 1.6px); background-size: 22px 22px; }
svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
#legend { position: absolute; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 32px); }
#legend button { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--c);
                 background: color-mix(in srgb, var(--c) 13%, var(--surface)); border-color: color-mix(in srgb, var(--c) 45%, transparent);
                 backdrop-filter: blur(8px); }
#legend button[aria-pressed="false"] { opacity: .4; filter: grayscale(.7); }
#legend i { width: 20px; height: 0; border-top: 3px solid; border-radius: 2px; display: inline-block; }
#zoom { position: absolute; right: 16px; top: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 5px;
        border-radius: 999px; background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(8px);
        box-shadow: 0 4px 16px var(--shadow); }
#zoom button { width: 34px; height: 34px; padding: 0; font-size: 19px; font-weight: 700; line-height: 1; color: #fff;
               background: linear-gradient(135deg, var(--accent3), var(--accent) 65%, var(--accent2)); }
#zoom #zoom-fit { font-size: 16px; color: #111; background: linear-gradient(135deg, var(--accent2), var(--accent)); }
#zoom-level { font-size: 10px; color: var(--muted); }
svg { cursor: grab; } svg.panning { cursor: grabbing; }
aside { width: 350px; border-left: 1px solid var(--line); background: var(--surface); backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px); overflow-y: auto; padding: 18px; }
aside h2 { font-size: 19px; margin: 0 0 2px; display: flex; align-items: center; gap: 10px; }
.swatch { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px var(--halo), 0 2px 8px var(--shadow); }
aside .ar { direction: rtl; color: var(--muted); margin: 0 0 10px; }
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 20px 0 8px;
           display: flex; align-items: center; gap: 8px; }
aside h3::before { content: ""; width: 14px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent3), var(--accent), var(--accent2)); }
.mono, pre { font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; }
.idtag { display: inline-block; padding: 1px 8px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 10%, transparent);
         color: var(--accent); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
.stat { border-radius: 14px; padding: 10px 12px; color: var(--muted); font-size: 12px;
        background: linear-gradient(135deg, color-mix(in srgb, var(--c) 18%, transparent), color-mix(in srgb, var(--c) 5%, transparent));
        border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
.stat b { display: block; font-size: 26px; line-height: 1.1; color: var(--c); }
.bar { flex: 1; height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 18%, transparent); overflow: hidden; align-self: center; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent2), var(--accent), var(--accent3)); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { --c: var(--accent2); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 999px; padding: 2px 10px;
        font-size: 12px; background: color-mix(in srgb, var(--c) 13%, transparent); }
.chip:nth-child(6n+1) { --c: #e10600; } .chip:nth-child(6n+2) { --c: #ffc400; } .chip:nth-child(6n+3) { --c: #555555; }
.chip:nth-child(6n+4) { --c: #ff7a00; } .chip:nth-child(6n+5) { --c: #b30000; } .chip:nth-child(6n) { --c: #e0a100; }
ul.rels { list-style: none; padding: 0; margin: 0; }
ul.rels li { padding: 4px 0; display: flex; gap: 8px; align-items: baseline; }
ul.rels .rel { font-size: 11px; min-width: 88px; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; align-self: center; flex: none; }
a.jump { color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
a.jump:hover { color: var(--accent); text-decoration-color: var(--accent); }
pre { background: var(--code-bg); color: var(--code-ink); border-radius: 12px; padding: 12px; margin: 0;
      white-space: pre-wrap; word-break: break-word; box-shadow: inset 0 0 0 1px rgba(255,196,0,.3); }
.ok { color: var(--ok); } .warn { color: var(--warn); }
.empty { color: var(--muted); }

.edge { fill: none; stroke-width: 2; opacity: .6; stroke-linecap: round; transition: opacity .3s, stroke-width .3s; }
.flow { fill: none; stroke-width: 3.4; stroke-dasharray: .1 13; stroke-linecap: round; opacity: .95; filter: url(#glow);
        animation: flow 1s linear infinite; pointer-events: none; }
@keyframes flow { to { stroke-dashoffset: -13.1; } }
.node .body { stroke: var(--halo); stroke-width: 2.5; filter: url(#shadow); transform-box: fill-box; transform-origin: center;
              transition: stroke .3s, stroke-width .3s, transform .2s; }
.node .gloss { fill: #fff; opacity: .5; pointer-events: none; }
.node.nomesh .body { stroke: var(--c); stroke-dasharray: 4 3; fill-opacity: .55; }
.node.root .body { stroke-width: 3.5; }
.node:hover .body { transform: scale(1.12); }
.node text { fill: var(--ink); font-size: 12px; font-weight: 600; paint-order: stroke; stroke: var(--halo); stroke-width: 4px;
             stroke-linejoin: round; pointer-events: none; }
.node { cursor: pointer; transition: opacity .3s; }
.node .ring { fill: none; stroke: var(--c); stroke-width: 2.5; opacity: 0; }
svg.selecting .node, svg.selecting .edge { opacity: .12; }
svg.selecting .flow { opacity: .1; }
svg.selecting .node.lit { opacity: 1; }
svg.selecting .edge.lit { opacity: 1; stroke-width: 3.2; filter: url(#glow); }
.node.lit .body { stroke: var(--c); stroke-width: 3; filter: url(#glow); }
.node.seed .body { stroke-width: 4; }
.node.seed .ring { animation: pulse 1.6s ease-out infinite; }
.node.pop .body { animation: pop .45s ease-out; }
@keyframes pulse { 0% { opacity: .9; r: 16; } 100% { opacity: 0; r: 46; } }
@keyframes pop { 0% { transform: scale(.8); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .flow, .node.seed .ring, .node.pop .body, header::after, .logo { animation: none; }
}
@media (max-width: 760px) {
  main { flex-direction: column; }
  #stage { min-height: 60vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1><span class="logo" aria-hidden="true"></span><b>AnatoLens ontology</b> <span class="sub">· structures.yaml relations</span></h1>
  <div class="group" id="lessons" role="group" aria-label="Lesson"><label>Lesson</label></div>
  <div class="group" role="group" aria-label="GraphRAG hops"><label>Hops</label>
    <button data-hops="1" aria-pressed="true">1</button><button data-hops="2" aria-pressed="false">2</button></div>
  <div class="group" role="group" aria-label="Label language"><label>Labels</label>
    <button data-lang="en" aria-pressed="true">EN</button><button data-lang="ar" aria-pressed="false">AR</button></div>
  <div class="group"><button id="relayout">Re-layout</button></div>
</header>
<main>
  <div id="stage">
    <svg id="svg" aria-label="Ontology graph"><defs id="defs"></defs><g id="viewport"><g id="edges"></g><g id="flows"></g><g id="nodes"></g></g></svg>
    <div id="zoom" role="group" aria-label="Zoom">
      <button id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <span id="zoom-level" class="mono">100%</span>
      <button id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <button id="zoom-fit" aria-label="Fit to screen" title="Fit to screen (0)">⤢</button>
    </div>
    <div id="legend"></div>
  </div>
  <aside id="panel"></aside>
</main>
<script>
const DATA = /*__DATA__*/[];
const ALL = { id: "all lessons", title: "All", nodes: DATA.flatMap(l => l.nodes), links: DATA.flatMap(l => l.links) };
const LESSONS = DATA.length > 1 ? [ALL, ...DATA] : DATA;
const REL_LABEL = { part_of: "part of", connects_to: "connects to", flows_to: "flows to", supplies: "supplies" };
const DIRECTED = new Set(["part_of", "flows_to", "supplies"]);
const R = 14, STEP_MS = 420;
const PALETTE = [["#ff9ec0", "#e8336d"], ["#ffc078", "#f76707"], ["#ffe680", "#f0a000"], ["#8ce99a", "#2f9e44"],
                 ["#7ff0cf", "#0ca678"], ["#8fd0ff", "#1c7ed6"], ["#a5b4ff", "#4263eb"], ["#dcb0ff", "#9c36b5"],
                 ["#ffa8c5", "#c2255c"], ["#7ee6f2", "#0c8599"]];
const ROOT_COLOR = ["#ffe066", "#e10600"];
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const relVar = rel => REL_LABEL[rel] ? `var(--rel-${rel})` : "var(--rel-other)";
const svg = $("#svg");

let lesson, nodes, byId, links, edges, hidden = new Set(), hops = 1, lang = "en", selected = null;
let alpha = 0, raf = 0, timers = [];

function load(idx) {
  lesson = LESSONS[idx];
  document.querySelectorAll("#lessons button").forEach((b, i) => b.setAttribute("aria-pressed", i === idx));
  const { width, height } = svg.getBoundingClientRect();
  const rad = 160 * Math.sqrt(Math.max(1, lesson.nodes.length / 12));
  nodes = lesson.nodes.map((n, i) => {
    const a = (i / lesson.nodes.length) * Math.PI * 2;
    return { ...n, color: PALETTE[i % PALETTE.length], x: width / 2 + Math.cos(a) * rad + Math.random() * 10, y: height / 2 + Math.sin(a) * rad, vx: 0, vy: 0 };
  });
  byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const seen = new Set();
  links = lesson.links.filter(l => byId[l.s] && byId[l.t]).filter(l => {
    const key = DIRECTED.has(l.rel) ? `${l.rel}|${l.s}|${l.t}` : `${l.rel}|${[l.s, l.t].sort().join("|")}`;
    return !seen.has(key) && seen.add(key);
  });
  const inbound = {};
  links.forEach(l => { if (l.rel === "part_of") inbound[l.t] = (inbound[l.t] || 0) + 1; });
  nodes.forEach(n => { n.root = (inbound[n.id] || 0) > 2; if (n.root) n.color = ROOT_COLOR; });
  const pairs = {};
  links.forEach(l => (pairs[[l.s, l.t].sort().join("|")] ||= []).push(l));
  Object.values(pairs).forEach(g => g.forEach((l, i) => l.bend = (i - (g.length - 1) / 2) * 34 * (l.s < l.t ? 1 : -1)));
  render();
  select(null);
  cancelAnimationFrame(tween); view = { k: 1, x: 0, y: 0 }; applyView();
  kick(1);
}

function render() {
  const defs = $("#defs"), ge = $("#edges"), gf = $("#flows"), gn = $("#nodes");
  defs.innerHTML = ge.innerHTML = gf.innerHTML = gn.innerHTML = "";
  const rels = [...new Set(links.map(l => l.rel))];
  const region = { filterUnits: "userSpaceOnUse", x: -5000, y: -5000, width: 10000, height: 10000 };
  const glow = el("filter", { id: "glow", ...region }, defs);
  el("feGaussianBlur", { stdDeviation: 3.5, result: "b" }, glow);
  const gm = el("feMerge", {}, glow); el("feMergeNode", { in: "b" }, gm); el("feMergeNode", { in: "SourceGraphic" }, gm);
  const shadow = el("filter", { id: "shadow", ...region }, defs);
  el("feDropShadow", { dx: 0, dy: 2, stdDeviation: 2.5, "flood-color": "#3a0a00", "flood-opacity": .3 }, shadow);
  nodes.forEach((n, i) => {
    const g = el("radialGradient", { id: `ng-${i}`, cx: "35%", cy: "30%", r: "75%" }, defs);
    el("stop", { offset: "0%", "stop-color": n.color[0] }, g);
    el("stop", { offset: "100%", "stop-color": n.color[1] }, g);
  });
  rels.forEach(rel => {
    const m = el("marker", { id: `arrow-${rel}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", style: `fill:${relVar(rel)}` }, m);
  });
  links.forEach(l => {
    l.path = el("path", { class: "edge", style: `stroke:${relVar(l.rel)}` }, ge);
    if (DIRECTED.has(l.rel)) l.path.setAttribute("marker-end", `url(#arrow-${l.rel})`);
    if (l.rel === "part_of") l.path.setAttribute("stroke-dasharray", "5 4");
    l.flow = l.rel === "flows_to" ? el("path", { class: "flow", style: `stroke:${relVar(l.rel)}` }, gf) : null;
    const t = el("title", {}, l.path); t.textContent = `${byId[l.s].en} ${REL_LABEL[l.rel] || l.rel} ${byId[l.t].en}`;
  });
  nodes.forEach((n, i) => {
    n.g = el("g", { class: `node${n.mesh ? "" : " nomesh"}${n.root ? " root" : ""}`, tabindex: 0, role: "button",
                    "aria-label": n.en, style: `--c:${n.color[1]}` }, gn);
    const r = n.root ? 18 : R;
    el("circle", { class: "ring", r: 16 }, n.g);
    el("circle", { class: "body", r, fill: `url(#ng-${i})` }, n.g);
    el("ellipse", { class: "gloss", cx: -r * .3, cy: -r * .38, rx: r * .38, ry: r * .24 }, n.g);
    n.label = el("text", { y: r + 15, "text-anchor": "middle" }, n.g);
    n.g.addEventListener("pointerdown", e => startDrag(e, n));
    n.g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(n.id); } });
  });
  setLabels();
  legend(rels);
}

function setLabels() {
  nodes.forEach(n => {
    n.label.textContent = lang === "ar" && n.ar ? n.ar : n.en;
    n.label.setAttribute("direction", lang === "ar" ? "rtl" : "ltr");
  });
}

function legend(rels) {
  const box = $("#legend"); box.innerHTML = "";
  rels.forEach(rel => {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", !hidden.has(rel));
    b.style.setProperty("--c", relVar(rel));
    b.innerHTML = `<i style="border-color:${relVar(rel)};${rel === "part_of" ? "border-top-style:dashed" : ""}"></i>${REL_LABEL[rel] || rel}`;
    b.onclick = () => { hidden.has(rel) ? hidden.delete(rel) : hidden.add(rel); b.setAttribute("aria-pressed", !hidden.has(rel)); applyHidden(); };
    box.appendChild(b);
  });
  applyHidden();
}
function applyHidden() {
  links.forEach(l => { const d = hidden.has(l.rel) ? "none" : ""; l.path.style.display = d; if (l.flow) l.flow.style.display = d; });
}

function kick(a = .5) { alpha = Math.max(alpha, a); if (!raf) raf = requestAnimationFrame(frame); }
function frame() {
  const { width, height } = svg.getBoundingClientRect();
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = Math.max(dx * dx + dy * dy, 80);
    const f = 5200 / d2, d = Math.sqrt(d2);
    dx /= d; dy /= d;
    a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
  }
  links.forEach(l => {
    const a = byId[l.s], b = byId[l.t];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const rest = l.rel === "part_of" ? 170 : 115, f = (d - rest) * .035;
    a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
  });
  nodes.forEach(n => {
    n.vx += (width / 2 - n.x) * .006; n.vy += (height / 2 - n.y) * .006;
    if (n.fixed) { n.vx = n.vy = 0; return; }
    n.vx *= .78; n.vy *= .78;
    n.x = Math.min(width - 30, Math.max(30, n.x + n.vx * alpha));
    n.y = Math.min(height - 40, Math.max(30, n.y + n.vy * alpha));
  });
  draw();
  alpha *= .985;
  raf = alpha > .02 ? requestAnimationFrame(frame) : 0;
}

function draw() {
  nodes.forEach(n => n.g.setAttribute("transform", `translate(${n.x},${n.y})`));
  links.forEach(l => {
    const a = byId[l.s], b = byId[l.t];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const cx = mx - dy / d * l.bend, cy = my + dx / d * l.bend;
    const ra = (a.root ? 18 : R) + 2, rb = (b.root ? 18 : R) + 4;
    const ua = Math.hypot(cx - a.x, cy - a.y) || 1, ub = Math.hypot(cx - b.x, cy - b.y) || 1;
    const d_ = `M${a.x + (cx - a.x) / ua * ra},${a.y + (cy - a.y) / ua * ra} Q${cx},${cy} ${b.x + (cx - b.x) / ub * rb},${b.y + (cy - b.y) / ub * rb}`;
    l.path.setAttribute("d", d_);
    if (l.flow) l.flow.setAttribute("d", d_);
  });
}

function toSvg(e) { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform($("#viewport").getScreenCTM().inverse()); }
function startDrag(e, n) {
  e.stopPropagation();
  const start = toSvg(e); let moved = false;
  n.g.setPointerCapture(e.pointerId);
  const move = ev => {
    const p = toSvg(ev);
    if (!moved && Math.hypot(p.x - start.x, p.y - start.y) < 4) return;
    moved = true; n.fixed = true; n.x = p.x; n.y = p.y; kick(.3); draw();
  };
  const up = () => {
    n.g.removeEventListener("pointermove", move); n.g.removeEventListener("pointerup", up);
    n.fixed = false;
    if (!moved) select(n.id);
  };
  n.g.addEventListener("pointermove", move); n.g.addEventListener("pointerup", up);
}

const ZMIN = .25, ZMAX = 4;
let view = { k: 1, x: 0, y: 0 }, tween = 0;
function applyView() {
  $("#viewport").setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
  $("#zoom-level").textContent = `${Math.round(view.k * 100)}%`;
}
function zoomed(k, cx, cy, from = view) {
  k = Math.min(ZMAX, Math.max(ZMIN, k));
  return { k, x: cx - (cx - from.x) * k / from.k, y: cy - (cy - from.y) * k / from.k };
}
function animateView(to, ms = 260) {
  cancelAnimationFrame(tween);
  const from = { ...view }, t0 = performance.now();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { view = to; return applyView(); }
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - t, 3);
    view = { k: from.k + (to.k - from.k) * e, x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e };
    applyView();
    if (t < 1) tween = requestAnimationFrame(step);
  };
  tween = requestAnimationFrame(step);
}
function zoomBy(f) { const { width, height } = svg.getBoundingClientRect(); animateView(zoomed(view.k * f, width / 2, height / 2)); }
function fit() {
  const { width, height } = svg.getBoundingClientRect();
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y), pad = 70;
  const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
  const k = Math.min(ZMAX, Math.max(ZMIN, Math.min(width / (x1 - x0), height / (y1 - y0), 1.6)));
  animateView({ k, x: width / 2 - (x0 + x1) / 2 * k, y: height / 2 - (y0 + y1) / 2 * k });
}
svg.addEventListener("wheel", e => {
  e.preventDefault();
  cancelAnimationFrame(tween);
  const r = svg.getBoundingClientRect();
  view = zoomed(view.k * Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top);
  applyView();
}, { passive: false });
svg.addEventListener("pointerdown", e => {
  const sx = e.clientX, sy = e.clientY, ox = view.x, oy = view.y;
  let moved = false;
  svg.setPointerCapture(e.pointerId);
  const move = ev => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 4) return;
    moved = true; svg.classList.add("panning"); cancelAnimationFrame(tween);
    view = { ...view, x: ox + ev.clientX - sx, y: oy + ev.clientY - sy }; applyView();
  };
  const up = () => {
    svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up);
    svg.classList.remove("panning");
    if (!moved) select(null);
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerup", up);
});
$("#zoom-in").onclick = () => zoomBy(1.3);
$("#zoom-out").onclick = () => zoomBy(1 / 1.3);
$("#zoom-fit").onclick = fit;
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (e.key === "+" || e.key === "=") zoomBy(1.3);
  else if (e.key === "-" || e.key === "_") zoomBy(1 / 1.3);
  else if (e.key === "0") fit();
});

function levels(start, maxHops) {
  const lvl = { [start]: 0 }, q = [start];
  while (q.length) {
    const cur = q.shift();
    if (lvl[cur] >= maxHops) continue;
    links.forEach(l => {
      const other = l.s === cur ? l.t : l.t === cur ? l.s : null;
      if (other && !(other in lvl)) { lvl[other] = lvl[cur] + 1; q.push(other); }
    });
  }
  return lvl;
}

function select(id) {
  timers.forEach(clearTimeout); timers = [];
  selected = id;
  nodes.forEach(n => n.g.classList.remove("lit", "seed", "pop"));
  links.forEach(l => l.path.classList.remove("lit"));
  svg.classList.toggle("selecting", !!id);
  panel();
  if (!id) return;
  const lvl = levels(id, hops);
  for (let h = 0; h <= hops; h++) {
    timers.push(setTimeout(() => {
      nodes.filter(n => lvl[n.id] === h).forEach(n => {
        n.g.classList.add("lit", "pop"); if (h === 0) n.g.classList.add("seed");
      });
      links.filter(l => l.s in lvl && l.t in lvl && Math.max(lvl[l.s], lvl[l.t]) === h && Math.abs(lvl[l.s] - lvl[l.t]) === 1)
           .forEach(l => l.path.classList.add("lit"));
    }, h * STEP_MS));
  }
}

function kn(n, locale) {
  const k = (n.knowledge || {})[locale] || {};
  return { approved: k.APPROVED || 0, other: Object.entries(k).filter(([s]) => s !== "APPROVED") };
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function relRow(rel, other, arrow) {
  return `<li><span class="rel mono" style="color:${relVar(rel)}">${arrow} ${esc(REL_LABEL[rel] || rel)}</span>
          <i class="dot" style="background:${other.color[1]}"></i><a class="jump" data-id="${esc(other.id)}">${esc(other.en)}</a></li>`;
}

function panel() {
  const p = $("#panel");
  if (!selected) {
    const locales = [...new Set(nodes.flatMap(n => Object.keys(n.knowledge || {})))].sort();
    p.innerHTML = `<h2>${esc(lesson.title)}</h2><span class="mono idtag">${esc(lesson.id)}</span>
      <div class="stats"><div class="stat" style="--c:var(--accent)"><b>${nodes.length}</b>structures</div>
        <div class="stat" style="--c:var(--accent2-ink)"><b>${links.length}</b>relations</div></div>
      <h3>How to read it</h3>
      <ul class="rels">
        <li>Dashed node: <span class="mono">mesh_name: null</span> (no hotspot in the 3D model)</li>
        <li>Animated dots: <span class="mono">flows_to</span> direction</li>
        <li>Click a structure to replay <span class="mono">graph.neighbors(id, hops)</span>: the seed lights up, then each hop.</li>
      </ul>
      <h3>Approved knowledge coverage</h3>
      <ul class="rels">${locales.map(loc => {
        const covered = nodes.filter(n => kn(n, loc).approved > 0).length;
        return `<li><span class="rel mono">${loc}</span><span class="bar"><i style="width:${covered / nodes.length * 100}%"></i></span>
                <span class="mono">${covered}/${nodes.length}</span></li>`;
      }).join("") || '<li class="empty">No knowledge packs found</li>'}</ul>`;
    return;
  }
  const n = byId[selected];
  const out = links.filter(l => l.s === n.id), inc = links.filter(l => l.t === n.id);
  const lvl = levels(n.id, hops);
  const seed = Object.keys(lvl).sort((a, b) => lvl[a] - lvl[b]);
  const locales = [...new Set(nodes.flatMap(x => Object.keys(x.knowledge || {})))].sort();
  const seedApproved = loc => seed.reduce((s, id) => s + kn(byId[id], loc).approved, 0);
  p.innerHTML = `
    <h2><span class="swatch" style="background:linear-gradient(135deg,${n.color[0]},${n.color[1]})"></span>${esc(n.en)}</h2>
    ${n.ar ? `<p class="ar">${esc(n.ar)}</p>` : ""}
    <span class="mono idtag">${esc(n.id)}</span>
    <h3>3D mesh</h3>
    <div class="mono">${n.mesh ? esc(n.mesh) : '<span class="warn">null: no hotspot, demo skips it</span>'}</div>
    <h3>Relations</h3>
    <ul class="rels">${out.map(l => relRow(l.rel, byId[l.t], "→")).join("")}${inc.map(l => relRow(l.rel, byId[l.s], "←")).join("")
      || '<li class="empty">none</li>'}</ul>
    <h3>Knowledge</h3>
    <ul class="rels">${locales.map(loc => {
      const k = kn(n, loc);
      return `<li><span class="rel mono">${loc}</span><span class="${k.approved ? "ok" : "warn"}">${k.approved} approved</span>
              ${k.other.map(([s, c]) => `<span class="empty">· ${c} ${esc(s.toLowerCase())}</span>`).join("")}</li>`;
    }).join("") || '<li class="empty">none</li>'}</ul>
    <h3>GraphRAG seed · hops=${hops}</h3>
    <pre class="mono">seed = [structure_id, *graph.neighbors(structure_id, hops=${hops})]
# → ${seed.length} ids
${seed.map(id => `  ${"·".repeat(lvl[id])}${lvl[id] ? " " : ""}${id}`).join("\n")}</pre>
    <p class="empty" style="margin:8px 0 0">retrieve_chunks() searches APPROVED chunks for these ids:
      ${locales.map(loc => `<span class="mono">${loc}</span> <b class="${seedApproved(loc) ? "ok" : "warn"}">${seedApproved(loc)}</b>`).join(" · ")}
      ${locales.some(loc => seedApproved(loc) > 0 && kn(n, loc).approved === 0)
        ? '<br><span class="warn">This structure has no approved text itself, but its neighbours do, so the tutor will still answer.</span>' : ""}</p>
    <h3>Aliases (OntologyResolver)</h3>
    <div class="chips">${n.aliases.map(a => `<span class="chip">${esc(a)}</span>`).join("") || '<span class="empty">none</span>'}</div>`;
  p.querySelectorAll("a.jump").forEach(a => a.onclick = () => select(a.dataset.id));
}

LESSONS.forEach((l, i) => {
  const b = document.createElement("button");
  b.textContent = l.title; b.onclick = () => load(i);
  $("#lessons").appendChild(b);
});
document.querySelectorAll("[data-hops]").forEach(b => b.onclick = () => {
  hops = +b.dataset.hops;
  document.querySelectorAll("[data-hops]").forEach(x => x.setAttribute("aria-pressed", x === b));
  select(selected);
});
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  document.querySelectorAll("[data-lang]").forEach(x => x.setAttribute("aria-pressed", x === b));
  setLabels();
});
$("#relayout").onclick = () => {
  const { width, height } = svg.getBoundingClientRect();
  nodes.forEach(n => { n.x = width / 2 + (Math.random() - .5) * 300; n.y = height / 2 + (Math.random() - .5) * 300; });
  kick(1);
};
window.addEventListener("resize", () => kick(.3));
(() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  if (!x || !x.createConicGradient) return;
  const g = x.createConicGradient(-Math.PI / 2, 32, 32);
  [["#ffc400", 0], ["#e10600", .25], ["#111111", .5], ["#e10600", .75], ["#ffc400", 1]].forEach(([col, at]) => g.addColorStop(at, col));
  x.fillStyle = g;
  x.beginPath(); x.arc(32, 32, 31, 0, Math.PI * 2); x.arc(32, 32, 16, 0, Math.PI * 2, true); x.fill();
  $("#favicon").type = "image/png"; $("#favicon").href = c.toDataURL("image/png");
})();
if (DATA.length) load(0); else $("#panel").textContent = "No lessons found.";
</script>
</body>
</html>
