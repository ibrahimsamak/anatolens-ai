- structure_id: digestive.digestive_system
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يتكوّن الجهاز الهضمي من القناة الهضمية، وهي أنبوب متصل يمتد من الفم عبر البلعوم والمريء
    والمعدة والأمعاء الدقيقة والأمعاء الغليظة حتى الشرج، ومن أعضاء ملحقة هي الغدد اللعابية والكبد
    والمرارة والبنكرياس. يتناول الطعام ويفتّته ميكانيكيًا وكيميائيًا، ويمتص المغذيات والماء،
    ويطرح البقايا غير المهضومة.

- structure_id: digestive.digestive_system
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يتألف جدار القناة الهضمية من المريء حتى القناة الشرجية من أربع طبقات: المخاطية وتحت المخاطية
    والطبقة العضلية الخارجية ثم المصلية أو البرانية. وتدفع موجات الانقباض في الطبقة العضلية
    (التمعّج) المحتويات إلى الأمام، بتحكّم من الجهاز العصبي المعوي وبتعديل من الأعصاب الذاتية
    وهرمونات الأمعاء.

- structure_id: digestive.esophagus
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    المريء أنبوب عضلي طوله نحو 25 سم، ينقل الطعام من البلعوم (عند مستوى الفقرة C6) إلى المعدة.
    ينزل خلف الرغامى والقلب، ويعبر الحجاب الحاجز من الفرجة المريئية عند مستوى الفقرة T10 تقريبًا.
    ثلثه العلوي عضلات هيكلية، وثلثه السفلي عضلات ملساء، وثلثه الأوسط مزيج منهما. وتتحكم مصرّتان
    مريئيتان علوية وسفلية في مرور الطعام وتساعدان على منع ارتجاع محتويات المعدة.

- structure_id: digestive.stomach
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    المعدة أوسع أجزاء القناة الهضمية، وتقع في الغالب في الجزء العلوي الأيسر من البطن. لها فؤاد
    وقاع وجسم وجزء بوابي، وانحناءان صغير وكبير. تفرز الغدد المعدية حمض الهيدروكلوريك والعامل
    الداخلي (الخلايا الجدارية) ومولّد الببسين (الخلايا الرئيسية). تخزّن المعدة الطعام وتمزجه
    حتى يصبح كيموسًا شبه سائل، وتنظّم المصرّة البوابية تفريغه إلى الاثني عشر.

- structure_id: digestive.duodenum
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    الاثنا عشر (العفج) هو الجزء الأول والأقصر من الأمعاء الدقيقة، وطوله نحو 25 سم. يلتف على شكل
    حرف C حول رأس البنكرياس، وله أربعة أجزاء: علوي ونازل وأفقي وصاعد. تنفتح القناة الصفراوية
    المشتركة والقناة البنكرياسية الرئيسية في الجزء النازل عند الحليمة الاثني عشرية الكبرى، فتختلط
    الصفراء وإنزيمات البنكرياس بالكيموس هنا. وينتهي عند الثنية الاثني عشرية الصائمية.

- structure_id: digestive.jejunum
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يشكّل الصائم نحو الخُمسين القريبين من الأمعاء الدقيقة بعد الاثني عشر، ويقع غالبًا في الجزء
    العلوي الأيسر من البطن معلّقًا بالمساريقا. مقارنة باللفائفي، تجويفه أوسع وجداره أثخن وثنياته
    الدائرية عالية ومتقاربة، وأوعيته المستقيمة طويلة وأقواسه الشريانية قليلة. وهو الموضع الرئيسي
    لامتصاص المغذيات.

- structure_id: digestive.ileum
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يشكّل اللفائفي الأخماس الثلاثة البعيدة من الأمعاء الدقيقة، ويقع غالبًا في الجزء السفلي الأيمن
    من البطن وفي الحوض. جداره أرق وثنياته الدائرية أقل، وتحمل مساريقاه أقواسًا شريانية أكثر
    بأوعية مستقيمة قصيرة. وتبرز فيه العقيدات اللمفاوية المتجمعة (لطخات باير). يمتص اللفائفي
    الانتهائي فيتامين B12 والأملاح الصفراوية، وينتهي عند الموصل اللفائفي الأعوري.

- structure_id: digestive.cecum
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    الأعور جيب مسدود النهاية في بداية الأمعاء الغليظة، يقع في الحفرة الحرقفية اليمنى تحت مستوى
    الموصل اللفائفي الأعوري. ينفتح فيه اللفائفي عبر الفتحة اللفائفية الأعورية التي تحدّ ثنياتها
    الشبيهة بالصمام من الارتجاع. تنشأ الزائدة الدودية من جداره الخلفي الإنسي، ويستمر صعودًا
    بالقولون الصاعد.

- structure_id: digestive.appendix
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    الزائدة الدودية أنبوب ضيق مسدود النهاية، طوله عادة 6-10 سم، ينشأ من الجدار الخلفي الإنسي
    للأعور حيث تلتقي الشرائط القولونية الثلاثة. يختلف موضعها، وأشيعها خلف الأعور. جدارها غني
    بالنسيج اللمفاوي. ويُعلَّم موضع قاعدتها على الجلد تقليديًا بنقطة ماكبرني، على ثلث المسافة من
    الشوكة الحرقفية الأمامية العلوية إلى السرة؛ والتهابها هو التهاب الزائدة الدودية.

- structure_id: digestive.ascending_colon
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يصعد القولون الصاعد في الجانب الأيمن من البطن من الأعور إلى الثنية القولونية اليمنى (الكبدية)
    تحت الكبد، وهو عادة خلف الصفاق. وكسائر القولون يظهر فيه ثلاثة شرائط عضلية طولية (الشرائط
    القولونية) وتكيّسات (الأكياس القولونية) وزوائد ثربية دهنية. يمتص القولون الماء والكهارل،
    فيحوّل المحتويات السائلة إلى براز.

- structure_id: digestive.transverse_colon
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يعبر القولون المستعرض البطن من الثنية القولونية اليمنى إلى الثنية القولونية اليسرى (الطحالية).
    وهو أطول أجزاء الأمعاء الغليظة وأكثرها حركة، معلّق بمساريقا القولون المستعرض، وكثيرًا ما يتدلى
    إلى ما دون مستوى العرفين الحرقفيين. ثلثاه القريبان من المعي المتوسط (الشريان القولوني الأوسط)
    وثلثه البعيد من المعي الخلفي (فروع الشريان المساريقي السفلي).

- structure_id: digestive.descending_colon
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    ينزل القولون النازل في الجانب الأيسر من البطن من الثنية القولونية اليسرى إلى حافة الحوض، حيث
    يصبح القولون السيني. وهو خلف الصفاق، ويغذّيه الشريان القولوني الأيسر من الشريان المساريقي
    السفلي. ومع مرور المحتويات فيه يزداد البراز صلابة بامتصاص الماء.

- structure_id: digestive.sigmoid_colon
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    القولون السيني عروة على شكل حرف S تمتد من حافة الحوض إلى المستقيم عند مستوى الفقرة S3 تقريبًا.
    يتعلق بمساريقا خاصة به هي مساريقا القولون السيني، مما يجعله متحركًا، وتغذّيه الشرايين السينية.
    وهو موضع شائع للرتوج، وقد يلتف حول مساريقاه (انفتال القولون السيني).

- structure_id: digestive.rectum
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يمتد المستقيم من القولون السيني عند مستوى الفقرة S3 تقريبًا إلى الموصل الشرجي المستقيمي، وطوله
    نحو 12 سم، ويتبع انحناء العجز. تنتشر فيه الشرائط القولونية لتكوّن طبقة عضلية متصلة، فلا توجد
    فيه أكياس قولونية ولا زوائد ثربية. ويحتفظ جزؤه السفلي المتوسع، الأمبولة المستقيمية، بالبراز
    حتى التغوّط.

- structure_id: digestive.anal_canal
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    القناة الشرجية هي آخر 3-4 سم من القناة الهضمية، تمتد من الموصل الشرجي المستقيمي، حيث تشكّل
    العضلة العانية المستقيمية حمّالة، إلى فتحة الشرج. تحيط بها مصرّة شرجية داخلية لاإرادية من
    عضلات ملساء ومصرّة شرجية خارجية إرادية من عضلات هيكلية. ويقسمها الخط المشطي إلى جزء علوي وجزء
    سفلي يختلفان في التروية الدموية والتصريف اللمفاوي والتعصيب.

- structure_id: digestive.liver
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    الكبد أكبر غدة في الجسم، وزنه نحو 1.5 كغ، ويقع في الجزء العلوي الأيمن من البطن تحت الحجاب
    الحاجز. له تروية دموية مزدوجة: نحو ثلاثة أرباعها من الوريد البابي الكبدي الحامل للدم الغني
    بالمغذيات من الأمعاء، والباقي من الشريان الكبدي. ويغادر الدم عبر الأوردة الكبدية إلى الوريد
    الأجوف السفلي. ينتج الكبد الصفراء، ويعالج المغذيات الممتصة، ويصنع بروتينات البلازما، ويخزّن
    الغليكوجين والفيتامينات، ويزيل سمية الأدوية والفضلات الاستقلابية.

- structure_id: digestive.liver
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    للكبد تشريحيًا فصوص أيمن وأيسر ومذنّب ومربّع. ووظيفيًا يُقسم إلى ثماني قطع (قطع كوينو)، لكل
    منها فرع خاص من الوريد البابي والشريان الكبدي والقناة الصفراوية، مما يتيح للجرّاحين استئصال
    قطع منفردة.

- structure_id: digestive.gallbladder
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    المرارة كيس كمّثري الشكل يقع في حفرة على السطح الحشوي للكبد، ولها قاع وجسم وعنق. تخزّن الصفراء
    وتركّزها، وتتسع لنحو 30-50 مل. بعد وجبة دسمة يجعلها هرمون الكوليسيستوكينين تنقبض فتطلق الصفراء
    عبر القناة المرارية والقناة الصفراوية المشتركة إلى الاثني عشر. وقد تتكوّن الحصوات المرارية
    عندما تصبح الصفراء فوق مشبعة.

- structure_id: digestive.bile_ducts
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    تصرّف القناتان الكبديتان اليمنى واليسرى الصفراء من الكبد وتتحدان لتكوّنا القناة الكبدية
    المشتركة. تنضم إليها القناة المرارية القادمة من المرارة لتكوّنا القناة الصفراوية المشتركة،
    التي تمر خلف الاثني عشر وعبر رأس البنكرياس. وتلتقي عادة بالقناة البنكرياسية الرئيسية عند
    الأمبولة الكبدية البنكرياسية التي تنفتح في الاثني عشر عند الحليمة الاثني عشرية الكبرى،
    وتحرسها مصرّة أودي.

- structure_id: digestive.pancreas
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    البنكرياس غدة خلف الصفاق تقع خلف المعدة. يستقر رأسه داخل انحناء الاثني عشر، وتمتد عنقه وجسمه
    وذيله إلى اليسار نحو الطحال. وبوصفه غدة خارجية الإفراز يفرز إنزيمات هاضمة (مثل مولّد التربسين
    والأميلاز والليباز) والبيكربونات إلى الاثني عشر عبر القناة البنكرياسية الرئيسية. وبوصفه غدة
    صماء تفرز جزر لانغرهانس فيه الإنسولين والغلوكاغون في الدم.
