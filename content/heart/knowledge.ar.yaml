- structure_id: heart.heart
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    القلب مضخة عضلية تقع في المنصف الأوسط داخل التامور. له أربع حجرات: أذينان يستقبلان الدم
    وبطينان يضخّانه. يضخ الجانب الأيمن الدم غير المؤكسج إلى الرئتين (الدورة الرئوية)، ويضخ
    الجانب الأيسر الدم المؤكسج إلى الجسم (الدورة الجهازية).

- structure_id: heart.heart
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يسري الدم في القلب بالترتيب التالي: الوريدان الأجوفان، الأذين الأيمن، الصمام ثلاثي الشرف،
    البطين الأيمن، الصمام الرئوي، الجذع الرئوي، الرئتان، الأوردة الرئوية، الأذين الأيسر،
    الصمام التاجي، البطين الأيسر، الصمام الأبهري، الأبهر. تحافظ الصمامات الأربعة على جريان
    الدم في اتجاه واحد.

- structure_id: heart.right_atrium
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يستقبل الأذين الأيمن الدم غير المؤكسج من الوريد الأجوف العلوي والوريد الأجوف السفلي
    والجيب التاجي، ويمرّره عبر الصمام ثلاثي الشرف إلى البطين الأيمن. يحوي جداره العقدة الجيبية
    الأذينية، وهي ناظمة القلب الطبيعية. والحفرة البيضية على الحاجز بين الأذينين هي بقايا
    الثقبة البيضية الجنينية.

- structure_id: heart.right_ventricle
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يشكّل البطين الأيمن معظم السطح الأمامي للقلب، ويضخ الدم غير المؤكسج عبر الصمام الرئوي إلى
    الجذع الرئوي. جداره أرقّ من جدار البطين الأيسر لأن الدورة الرئوية منخفضة الضغط. وفي
    داخله تربيقات لحمية وعضلات حليمية والحزمة المعدِّلة.

- structure_id: heart.left_atrium
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يشكّل الأذين الأيسر معظم قاعدة القلب (سطحه الخلفي). يستقبل الدم المؤكسج من الرئتين عبر
    الأوردة الرئوية، وعددها عادةً أربعة، ويمرّره عبر الصمام التاجي إلى البطين الأيسر. ولقربه
    من المريء يمكن تصويره بتخطيط صدى القلب عبر المريء.

- structure_id: heart.left_ventricle
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يشكّل البطين الأيسر قمة القلب ومعظم سطحه الأيسر. جداره هو الأسمك بين الحجرات الأربع،
    وعادةً أسمك من جدار البطين الأيمن بمرتين إلى ثلاث، لأنه يضخ الدم المؤكسج عبر الصمام الأبهري إلى
    الدورة الجهازية عالية الضغط.

- structure_id: heart.tricuspid_valve
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يقع الصمام ثلاثي الشرف (الصمام الأذيني البطيني الأيمن) بين الأذين الأيمن والبطين الأيمن.
    له ثلاث شُرَف (أمامية وخلفية وحاجزية) تثبّتها الحبال الوترية بالعضلات الحليمية، فتمنعها من
    الانقلاب نحو الأذين عند انقباض البطين.

- structure_id: heart.mitral_valve
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يقع الصمام التاجي (ثنائي الشرف، الصمام الأذيني البطيني الأيسر) بين الأذين الأيسر والبطين
    الأيسر. له شرفتان، أمامية وخلفية، تثبّتهما الحبال الوترية بالعضلتين الحليميتين الأمامية
    الجانبية والخلفية الإنسية. ينغلق أثناء الانقباض البطيني ليمنع ارتجاع الدم إلى الأذين الأيسر.

- structure_id: heart.pulmonary_valve
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    الصمام الرئوي صمام هلالي ذو ثلاث شُرَف عند ملتقى البطين الأيمن والجذع الرئوي. ينفتح أثناء
    الانقباض البطيني وينغلق أثناء الانبساط، فيمنع عودة الدم إلى البطين الأيمن.

- structure_id: heart.aortic_valve
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    الصمام الأبهري صمام هلالي ذو ثلاث شُرَف (يمنى ويسرى وخلفية) بين البطين الأيسر والأبهر
    الصاعد. فوق الشُّرَف تقع الجيوب الأبهرية، ومن الجيبين الأيمن والأيسر ينشأ الشريانان التاجيان
    الأيمن والأيسر.

- structure_id: heart.aorta
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    الأبهر هو الشريان الرئيسي للدورة الجهازية. يبدأ عند الصمام الأبهري بالأبهر الصاعد، وفرعاه
    الوحيدان هما الشريانان التاجيان. يستمر بقوس الأبهر الذي يعطي الجذع العضدي الرأسي والشريان
    السباتي المشترك الأيسر والشريان تحت الترقوة الأيسر، ثم ينزل بوصفه الأبهر النازل (الصدري).

- structure_id: heart.pulmonary_trunk
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    ينقل الجذع الرئوي الدم غير المؤكسج من البطين الأيمن، ثم ينقسم إلى الشريانين الرئويين الأيمن
    والأيسر المتجهين إلى الرئتين. ويصل الرباط الشرياني، وهو بقايا القناة الشريانية الجنينية،
    بين الشريان الرئوي الأيسر وقوس الأبهر.

- structure_id: heart.coronary_arteries
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يغذّي الشريانان التاجيان الأيمن والأيسر عضلة القلب. ينقسم الشريان التاجي الأيسر إلى الفرع
    الأمامي بين البطينين (النازل الأمامي الأيسر) والفرع المنعطف. ويغذّي الشريان التاجي الأيمن
    عادةً العقدتين الجيبية الأذينية والأذينية البطينية، ويعطي لدى معظم الناس الفرع الخلفي بين
    البطينين. قد يؤدي انسداد أحد الشرايين التاجية إلى احتشاء عضلة القلب.

- structure_id: heart.cardiac_veins
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يعود معظم دم عضلة القلب عبر الأوردة القلبية التي تصب في الجيب التاجي، وهو يسير في الجزء
    الخلفي من الثلم التاجي ويفتح في الأذين الأيمن. أهم روافده الأوردة القلبية الكبيرة والمتوسطة
    والصغيرة، أما الأوردة القلبية الأمامية فتصب مباشرة في الأذين الأيمن.

- structure_id: heart.superior_vena_cava
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يعيد الوريد الأجوف العلوي الدم غير المؤكسج من الرأس والعنق والطرفين العلويين ومعظم جدار
    الصدر إلى الأذين الأيمن. يتكوّن من اتحاد الوريدين العضديين الرأسيين الأيمن والأيسر، ويستقبل
    الوريد الفرد قبل دخوله الأذين.

- structure_id: heart.inferior_vena_cava
  review_status: APPROVED
  source: "Gray's Anatomy (ملخص تعليمي)"
  source_version: "dev-seed-2026-10"
  reviewer: pending
  text: >
    يعيد الوريد الأجوف السفلي الدم غير المؤكسج من الطرفين السفليين والحوض والبطن إلى الأذين
    الأيمن. يتكوّن من اتحاد الوريدين الحرقفيين المشتركين، ويعبر الحجاب الحاجز عبر الفتحة
    الأجوفية عند مستوى الفقرة T8 تقريبًا. يُظهر النموذج فقط جزءه الانتهائي القصير الداخل إلى
    الأذين الأيمن.
