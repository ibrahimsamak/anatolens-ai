<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AnatoLens</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffc400'/%3E%3Cstop offset='.5' stop-color='%23e10600'/%3E%3Cstop offset='1' stop-color='%23111'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='url(%23g)' stroke-width='15'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="login-page">
  <main class="login">
    <h1><span class="logo" aria-hidden="true"></span>AnatoLens</h1>
    <p class="lede">Sign in to open your lessons, quizzes and results.</p>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="login-submit" type="submit">Sign in</button>
      <p id="login-status" role="status"></p>
    </form>
    <section class="demo-accounts" aria-labelledby="demo-h">
      <h2 id="demo-h">Demo accounts</h2>
      <p class="hint">Seeded by <code>python -m app.seed_users</code>. Password for all: <code>demo1234</code></p>
      <div id="demo-list" class="demo-list"></div>
    </section>
  </main>
  <script type="module" src="/src/login.ts"></script>
</body>
</html>
