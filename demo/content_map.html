<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnatoLens Content Map</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --sunk: #efeee9; --ink: #1d1f24; --muted: #6b6f78; --line: #dcdad3;
  --accent: #c2410c; --accent-soft: #fde7da; --wire: #b9b6ad;
  --ok: #2f7d4f; --ok-soft: #e1f2e7; --warn: #a86400; --warn-soft: #fbefd9; --err: #b42318; --err-soft: #fde4e1;
  --info: #44607f; --info-soft: #e3ebf4;
  --rel-part_of: #8a8f99; --rel-connects_to: #2f6fb3; --rel-flows_to: #c0392b; --rel-supplies: #7a4fb8; --rel-other: #3f8f6b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --surface: #1b1e24; --sunk: #16181d; --ink: #e8e9ec; --muted: #9aa0ab; --line: #2c3038;
    --accent: #ff8a4c; --accent-soft: #3a2418; --wire: #4a4f59;
    --ok: #5cc08a; --ok-soft: #173123; --warn: #e0a040; --warn-soft: #362a12; --err: #f07167; --err-soft: #3a1c1a;
    --info: #8fb0d6; --info-soft: #1c2735;
    --rel-part_of: #7d838e; --rel-connects_to: #5b9be0; --rel-flows_to: #ef6b5b; --rel-supplies: #a884e0; --rel-other: #5cc095;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1b1e24; --sunk: #16181d; --ink: #e8e9ec; --muted: #9aa0ab; --line: #2c3038;
  --accent: #ff8a4c; --accent-soft: #3a2418; --wire: #4a4f59;
  --ok: #5cc08a; --ok-soft: #173123; --warn: #e0a040; --warn-soft: #362a12; --err: #f07167; --err-soft: #3a1c1a;
  --info: #8fb0d6; --info-soft: #1c2735;
  --rel-part_of: #7d838e; --rel-connects_to: #5b9be0; --rel-flows_to: #ef6b5b; --rel-supplies: #a884e0; --rel-other: #5cc095;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; }
.muted { color: var(--muted); }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
         padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; margin: 0; }
h1 span { color: var(--muted); font-weight: 400; }
.group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line);
         border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, .cell:focus-visible, .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 16px; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
#summary { display: flex; gap: 6px; flex-wrap: wrap; }
.stat { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--sunk); }

#scroller { overflow-x: auto; padding: 20px 16px 40px; }
#board { position: relative; display: flex; gap: 28px; width: max-content; min-width: 100%; }
#wires { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

#side { width: 260px; flex: none; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
#lessonCard { position: relative; }
#lessonCard img { width: 100%; max-height: 150px; object-fit: contain; background: var(--sunk); border-radius: 6px; margin-bottom: 8px; }
#lessonCard h2 { margin: 0; font-size: 17px; }
#fanOrigin { position: absolute; right: -5px; top: 50%; width: 10px; height: 10px; border-radius: 50%;
             background: var(--accent); }
dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 12px; }
dt { color: var(--muted); } dd { margin: 0; word-break: break-all; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
ul.files, ul.checks { list-style: none; margin: 0; padding: 0; }
ul.files li { padding: 6px 8px; border-radius: 6px; cursor: default; border: 1px solid transparent; }
ul.files li:hover, ul.files li.hl { background: var(--sunk); border-color: var(--line); }
ul.files li .use { font-size: 11px; color: var(--muted); display: block; }
ul.files li.missing { opacity: .55; } ul.files li.missing .mono { text-decoration: line-through; }
ul.checks li { display: flex; gap: 6px; padding: 4px 0; font-size: 12px; border-top: 1px solid var(--line); }
ul.checks li:first-child { border-top: 0; }
ul.checks li[data-sid] { cursor: pointer; }
.tag { font-size: 10px; font-weight: 600; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; height: fit-content; flex: none; }
.tag.error { background: var(--err-soft); color: var(--err); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.info { background: var(--info-soft); color: var(--info); } .tag.ok { background: var(--ok-soft); color: var(--ok); }

#grid { display: grid; gap: 8px 22px; align-content: start; }
.hd { font-weight: 600; font-size: 13px; padding: 0 2px 4px; border-bottom: 2px solid var(--line); transition: border-color .2s; }
.hd small { display: block; font-weight: 400; color: var(--muted); }
.hd.gutter { border: 0; }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 58px;
        opacity: 0; transition: opacity .35s, border-color .2s, background .2s; }
.cell.in { opacity: 1; }
.cell.gap { background: transparent; border-style: dashed; color: var(--muted); font-size: 12px; display: flex; align-items: center; }
.cell.gap.warn { border-color: var(--warn); color: var(--warn); }
.cell.st { cursor: pointer; position: relative; }
.cell.st .name { font-weight: 600; }
.cell.st .ar { direction: rtl; color: var(--muted); font-size: 12px; }
.cell.st .badge { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; }
.badge.error { background: var(--err); } .badge.warn { background: var(--warn); }
.cell.clickable { cursor: pointer; }
.ok-t { color: var(--ok); } .err-t { color: var(--err); } .warn-t { color: var(--warn); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-size: 11px; border-radius: 999px; padding: 1px 8px; cursor: pointer; border: 1px solid transparent; }
.pill.APPROVED { background: var(--ok-soft); color: var(--ok); }
.pill:not(.APPROVED) { background: var(--warn-soft); color: var(--warn); }
.pill:hover { border-color: currentColor; }
.colhl { border-color: var(--accent) !important; }
.hd.colhl { border-bottom-color: var(--accent) !important; }
#grid.focus .cell:not(.row-sel):not(.row-rel) { opacity: .35; }
.cell.row-sel { border-color: var(--accent); background: var(--accent-soft); }
.cell.st.row-rel { border-color: var(--ink); }

.wire { fill: none; stroke: var(--wire); stroke-width: 1.5; transition: opacity .25s; }
.wire.gapw { stroke-dasharray: 3 4; }
.wire.fan { stroke: var(--accent); opacity: .35; }
#board.focus .wire { opacity: .15; }
#board.focus .wire.sel { opacity: 1; stroke: var(--accent); stroke-width: 2; }
.arc { fill: none; stroke-width: 2; }
.arc-label { font-size: 10px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }

#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface);
          border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.12); z-index: 10;
          transform: translateX(105%); transition: transform .3s ease; overflow-y: auto; padding: 18px; }
#drawer.open { transform: none; }
#drawer .close { float: right; }
#drawer h2 { margin: 0 0 2px; font-size: 18px; }
#drawer h3 { margin-top: 18px; }
#drawer .text { white-space: pre-wrap; line-height: 1.6; background: var(--sunk); border-radius: 8px; padding: 12px; }
#drawer .text[dir="rtl"] { font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
ul.rels { list-style: none; padding: 0; margin: 0; }
ul.rels li { padding: 3px 0; }
a.jump { color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); }
@media (prefers-reduced-motion: reduce) { .cell, #drawer, .wire { transition: none; } }
@media (max-width: 700px) { #side { width: 220px; } }
</style>
</head>

_CardiacVeins", "position": "-0.0228m 0.0459m 0.0537m", "normal": "-0.1669 -0.07 0.9835"}, {"structure_id": "heart.superior_vena_cava", "mesh_name": "Heart_SuperiorVenaCava", "position": "-0.0333m 0.1339m 0.0129m", "normal": "0.3428 -0.0288 0.939"}, {"structure_id": "heart.inferior_vena_cava", "mesh_name": "Heart_InferiorVenaCava", "position": "-0.033m 0.0115m 0.0123m", "normal": "0.388 -0.0133 0.9216"}], "knowledge": {"ar": [{"structure_id": "heart.heart", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "القلب مضخة عضلية تقع في المنصف الأوسط داخل التامور. له أربع حجرات: أذينان يستقبلان الدم وبطينان يضخّانه. يضخ الجانب الأيمن الدم غير المؤكسج إلى الرئتين (الدورة الرئوية)، ويضخ الجانب الأيسر الدم المؤكسج إلى الجسم (الدورة الجهازية).\n"}, {"structure_id": "heart.heart", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يسري الدم في القلب بالترتيب التالي: الوريدان الأجوفان، الأذين الأيمن، الصمام ثلاثي الشرف، البطين الأيمن، الصمام الرئوي، الجذع الرئوي، الرئتان، الأوردة الرئوية، الأذين الأيسر، الصمام التاجي، البطين الأيسر، الصمام الأبهري، الأبهر. تحافظ الصمامات الأربعة على جريان الدم في اتجاه واحد.\n"}, {"structure_id": "heart.right_atrium", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يستقبل الأذين الأيمن الدم غير المؤكسج من الوريد الأجوف العلوي والوريد الأجوف السفلي والجيب التاجي، ويمرّره عبر الصمام ثلاثي الشرف إلى البطين الأيمن. يحوي جداره العقدة الجيبية الأذينية، وهي ناظمة القلب الطبيعية. والحفرة البيضية على الحاجز بين الأذينين هي بقايا الثقبة البيضية الجنينية.\n"}, {"structure_id": "heart.right_ventricle", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يشكّل البطين الأيمن معظم السطح الأمامي للقلب، ويضخ الدم غير المؤكسج عبر الصمام الرئوي إلى الجذع الرئوي. جداره أرقّ من جدار البطين الأيسر لأن الدورة الرئوية منخفضة الضغط. وفي داخله تربيقات لحمية وعضلات حليمية والحزمة المعدِّلة.\n"}, {"structure_id": "heart.left_atrium", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يشكّل الأذين الأيسر معظم قاعدة القلب (سطحه الخلفي). يستقبل الدم المؤكسج من الرئتين عبر الأوردة الرئوية، وعددها عادةً أربعة، ويمرّره عبر الصمام التاجي إلى البطين الأيسر. ولقربه من المريء يمكن تصويره بتخطيط صدى القلب عبر المريء.\n"}, {"structure_id": "heart.left_ventricle", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يشكّل البطين الأيسر قمة القلب ومعظم سطحه الأيسر. جداره هو الأسمك بين الحجرات الأربع، وعادةً أسمك من جدار البطين الأيمن بمرتين إلى ثلاث، لأنه يضخ الدم المؤكسج عبر الصمام الأبهري إلى الدورة الجهازية عالية الضغط.\n"}, {"structure_id": "heart.tricuspid_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يقع الصمام ثلاثي الشرف (الصمام الأذيني البطيني الأيمن) بين الأذين الأيمن والبطين الأيمن. له ثلاث شُرَف (أمامية وخلفية وحاجزية) تثبّتها الحبال الوترية بالعضلات الحليمية، فتمنعها من الانقلاب نحو الأذين عند انقباض البطين.\n"}, {"structure_id": "heart.mitral_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يقع الصمام التاجي (ثنائي الشرف، الصمام الأذيني البطيني الأيسر) بين الأذين الأيسر والبطين الأيسر. له شرفتان، أمامية وخلفية، تثبّتهما الحبال الوترية بالعضلتين الحليميتين الأمامية الجانبية والخلفية الإنسية. ينغلق أثناء الانقباض البطيني ليمنع ارتجاع الدم إلى الأذين الأيسر.\n"}, {"structure_id": "heart.pulmonary_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "الصمام الرئوي صمام هلالي ذو ثلاث شُرَف عند ملتقى البطين الأيمن والجذع الرئوي. ينفتح أثناء الانقباض البطيني وينغلق أثناء الانبساط، فيمنع عودة الدم إلى البطين الأيمن.\n"}, {"structure_id": "heart.aortic_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "الصمام الأبهري صمام هلالي ذو ثلاث شُرَف (يمنى ويسرى وخلفية) بين البطين الأيسر والأبهر الصاعد. فوق الشُّرَف تقع الجيوب الأبهرية، ومن الجيبين الأيمن والأيسر ينشأ الشريانان التاجيان الأيمن والأيسر.\n"}, {"structure_id": "heart.aorta", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "الأبهر هو الشريان الرئيسي للدورة الجهازية. يبدأ عند الصمام الأبهري بالأبهر الصاعد، وفرعاه الوحيدان هما الشريانان التاجيان. يستمر بقوس الأبهر الذي يعطي الجذع العضدي الرأسي والشريان السباتي المشترك الأيسر والشريان تحت الترقوة الأيسر، ثم ينزل بوصفه الأبهر النازل (الصدري).\n"}, {"structure_id": "heart.pulmonary_trunk", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "ينقل الجذع الرئوي الدم غير المؤكسج من البطين الأيمن، ثم ينقسم إلى الشريانين الرئويين الأيمن والأيسر المتجهين إلى الرئتين. ويصل الرباط الشرياني، وهو بقايا القناة الشريانية الجنينية، بين الشريان الرئوي الأيسر وقوس الأبهر.\n"}, {"structure_id": "heart.coronary_arteries", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يغذّي الشريانان التاجيان الأيمن والأيسر عضلة القلب. ينقسم الشريان التاجي الأيسر إلى الفرع الأمامي بين البطينين (النازل الأمامي الأيسر) والفرع المنعطف. ويغذّي الشريان التاجي الأيمن عادةً العقدتين الجيبية الأذينية والأذينية البطينية، ويعطي لدى معظم الناس الفرع الخلفي بين البطينين. قد يؤدي انسداد أحد الشرايين التاجية إلى احتشاء عضلة القلب.\n"}, {"structure_id": "heart.cardiac_veins", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يعود معظم دم عضلة القلب عبر الأوردة القلبية التي تصب في الجيب التاجي، وهو يسير في الجزء الخلفي من الثلم التاجي ويفتح في الأذين الأيمن. أهم روافده الأوردة القلبية الكبيرة والمتوسطة والصغيرة، أما الأوردة القلبية الأمامية فتصب مباشرة في الأذين الأيمن.\n"}, {"structure_id": "heart.superior_vena_cava", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يعيد الوريد الأجوف العلوي الدم غير المؤكسج من الرأس والعنق والطرفين العلويين ومعظم جدار الصدر إلى الأذين الأيمن. يتكوّن من اتحاد الوريدين العضديين الرأسيين الأيمن والأيسر، ويستقبل الوريد الفرد قبل دخوله الأذين.\n"}, {"structure_id": "heart.inferior_vena_cava", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يعيد الوريد الأجوف السفلي الدم غير المؤكسج من الطرفين السفليين والحوض والبطن إلى الأذين الأيمن. يتكوّن من اتحاد الوريدين الحرقفيين المشتركين، ويعبر الحجاب الحاجز عبر الفتحة الأجوفية عند مستوى الفقرة T8 تقريبًا. يُظهر النموذج فقط جزءه الانتهائي القصير الداخل إلى الأذين الأيمن.\n"}], "en": [{"structure_id": "heart.heart", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The heart is a muscular pump in the middle mediastinum, enclosed in the pericardium. It has four chambers: two atria that receive blood and two ventricles that pump it out. The right side pumps deoxygenated blood to the lungs (pulmonary circulation). The left side pumps oxygenated blood to the body (systemic circulation).\n"}, {"structure_id": "heart.heart", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "Blood flows through the heart in this order: venae cavae, right atrium, tricuspid valve, right ventricle, pulmonary valve, pulmonary trunk, lungs, pulmonary veins, left atrium, mitral valve, left ventricle, aortic valve, aorta. The four valves keep this flow in one direction.\n"}, {"structure_id": "heart.right_atrium", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The right atrium receives deoxygenated blood from the superior vena cava, the inferior vena cava and the coronary sinus, and passes it through the tricuspid valve to the right ventricle. Its wall contains the sinoatrial (SA) node, the heart's natural pacemaker. The fossa ovalis on the interatrial septum is the remnant of the fetal foramen ovale.\n"}, {"structure_id": "heart.right_ventricle", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The right ventricle forms most of the anterior surface of the heart. It pumps deoxygenated blood through the pulmonary valve into the pulmonary trunk. Its wall is thinner than the left ventricle's because the pulmonary circulation is a low-pressure system. Its interior has trabeculae carneae, papillary muscles and the septomarginal trabecula (moderator band).\n"}, {"structure_id": "heart.left_atrium", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The left atrium forms most of the base (posterior surface) of the heart. It receives oxygenated blood from the lungs, usually through four pulmonary veins, and passes it through the mitral valve to the left ventricle. Its close relation to the esophagus is the basis of transesophageal echocardiography.\n"}, {"structure_id": "heart.left_ventricle", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The left ventricle forms the apex of the heart and most of its left (pulmonary) surface. It has the thickest wall of the four chambers, typically two to three times thicker than the right ventricle's, because it pumps oxygenated blood through the aortic valve into the high-pressure systemic circulation.\n"}, {"structure_id": "heart.tricuspid_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The tricuspid (right atrioventricular) valve lies between the right atrium and the right ventricle. It has three leaflets (anterior, posterior and septal), anchored by chordae tendineae to papillary muscles. These stop the leaflets everting into the atrium when the ventricle contracts.\n"}, {"structure_id": "heart.mitral_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The mitral (bicuspid, left atrioventricular) valve lies between the left atrium and the left ventricle. It has two leaflets, anterior and posterior, held by chordae tendineae attached to the anterolateral and posteromedial papillary muscles. It closes during ventricular systole to prevent backflow into the left atrium.\n"}, {"structure_id": "heart.pulmonary_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The pulmonary valve is a semilunar valve with three cusps at the junction of the right ventricle and the pulmonary trunk. It opens during ventricular systole and closes during diastole, preventing blood from returning to the right ventricle.\n"}, {"structure_id": "heart.aortic_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The aortic valve is a semilunar valve with three cusps (right, left and posterior) between the left ventricle and the ascending aorta. Above the cusps are the aortic sinuses; the right and left coronary arteries arise from the right and left aortic sinuses.\n"}, {"structure_id": "heart.aorta", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The aorta is the main artery of the systemic circulation. It begins at the aortic valve as the ascending aorta, whose only branches are the coronary arteries. It continues as the arch of the aorta, which gives off the brachiocephalic trunk, the left common carotid artery and the left subclavian artery, and then descends as the descending (thoracic) aorta.\n"}, {"structure_id": "heart.pulmonary_trunk", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The pulmonary trunk carries deoxygenated blood from the right ventricle and divides into the right and left pulmonary arteries, which run to the lungs. The ligamentum arteriosum, the remnant of the fetal ductus arteriosus, connects the left pulmonary artery to the arch of the aorta.\n"}, {"structure_id": "heart.coronary_arteries", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The right and left coronary arteries supply the myocardium. The left coronary artery divides into the anterior interventricular (left anterior descending) branch and the circumflex branch. The right coronary artery usually supplies the SA and AV nodes and, in most people, gives off the posterior interventricular branch. Blockage of a coronary artery can cause a myocardial infarction.\n"}, {"structure_id": "heart.cardiac_veins", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "Most blood from the myocardium returns through cardiac veins that drain into the coronary sinus, which runs in the posterior part of the coronary sulcus and opens into the right atrium. Its main tributaries are the great, middle and small cardiac veins. Anterior cardiac veins drain directly into the right atrium.\n"}, {"structure_id": "heart.superior_vena_cava", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The superior vena cava returns deoxygenated blood from the head, neck, upper limbs and most of the thoracic wall to the right atrium. It is formed by the union of the right and left brachiocephalic veins and receives the azygos vein before entering the atrium.\n"}, {"structure_id": "heart.inferior_vena_cava", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The inferior vena cava returns deoxygenated blood from the lower limbs, pelvis and abdomen to the right atrium. It is formed by the union of the common iliac veins and passes through the caval opening of the diaphragm at about the level of T8. The model shows only its short terminal segment entering the right atrium.\n"}]}, "checks": [{"level": "error", "msg": "knowledge.ar.yaml exists but ingest.py never loads it", "sid": null}, {"level": "info", "msg": "quiz.yaml not authored yet (quiz service (not built yet))", "sid": null}, {"level": "info", "msg": "mesh_name is null: no 3D hotspot", "sid": "heart.heart"}, {"level": "info", "msg": "knowledge.ar.yaml: 16/16 chunks have reviewer pending (dev seed)", "sid": null}, {"level": "info", "msg": "knowledge.en.yaml: 16/16 chunks have reviewer pending (dev seed)", "sid": null}]}, {"dir": "spine", "lesson": {"id": "spine_001", "title": "Vertebral Column", "system": "skeletal", "model_url": "/assets/spine.glb", "ios_model_url": "/asse ", "text": "تضم المنطقة العنقية سبع فقرات (C1-C7)، وهي أصغر الفقرات المتحركة. في الناتئ المستعرض لكل منها ثقبة مستعرضة، وتمرّ عبر ثقبات الفقرات C1 إلى C6 الشريانُ الفقري. الفقرة الأولى (الفهقة/الأطلس) بلا جسم وتحمل الجمجمة وتسمح بإيماء الرأس. الفقرة الثانية (المحور) لها السِّن الذي تدور حوله الفهقة لالتفات الرأس.\n"}, {"structure_id": "spine.thoracic_region", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "تضم المنطقة الصدرية اثنتي عشرة فقرة (T1-T12)، وأهم ما يميّزها وجود سُطيحات ضلعية على أجسامها ونواتئها المستعرضة تتمفصل مع الأضلاع. نواتئها الشوكية طويلة ومائلة إلى الأسفل ومتراكبة. يحدّ القفص الصدري من حركتها، مع أن الدوران حرّ نسبيًا.\n"}, {"structure_id": "spine.lumbar_region", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "تتكوّن المنطقة القطنية من خمس فقرات (L1-L5)، وهي أكبر الفقرات المتحركة. تحمل معظم وزن الجسم وتسمح بثني أسفل الظهر وبسطه مع دوران محدود. أجسامها كبيرة كلوية الشكل، ونواتئها الشوكية قصيرة وسميكة، ولا تحوي ثقبات مستعرضة ولا سُطيحات ضلعية.\n"}, {"structure_id": "spine.lumbar_region", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "ينتهي الحبل الشوكي لدى البالغ عادةً عند مستوى L1-L2 (المخروط النخاعي)، وتحوي القناة الفقرية أسفله ذيل الفرس. لذلك يُجرى البزل القطني بين L3 وL4 أو بين L4 وL5 بعيدًا عن الحبل الشوكي.\n"}, {"structure_id": "spine.sacral_region", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "العجز عظم مثلثي يتكوّن من التحام خمس فقرات عجزية (S1-S5). يتمفصل من الأعلى مع الفقرة L5 في المفصل القطني العجزي، ومن الجانبين مع عظمي الحرقفة في المفصلين العجزيين الحرقفيين، ومن الأسفل مع العصعص. ينقل وزن الجسم إلى الحزام الحوضي، وتمرّ عبر ثقباته الأمامية والخلفية فروع الأعصاب الشوكية l curvatures are primary curvatures (kyphoses), concave anteriorly and present from fetal life. The cervical and lumbar curvatures are secondary curvatures (lordoses), concave posteriorly, developing as the infant holds up its head and begins to stand and walk.\n"}, {"structure_id": "spine.cervical_region", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The cervical region has seven vertebrae (C1-C7), the smallest movable vertebrae. Each has a foramen transversarium in its transverse process; those of C1-C6 transmit the vertebral artery. C1 (atlas) has no body and carries the skull, permitting nodding at the atlanto-occipital joints. C2 (axis) has the dens, around which the atlas rotates to turn the head.\n"}, {"structure_id": "spine.thoracic_region", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The thoracic region has twelve vertebrae (T1-T12). Their defining feature is costal facets on the bodies and transverse processes, which articulate with the ribs. Long spinous processes slope downward and overlap. Movement is limited by the rib cage and sternum, although rotation is relatively free.\n"}, {"structure_id": "spine.lumbar_region", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The lumbar region consists of five vertebrae (L1-L5), the largest movable vertebrae. They bear most of the body's weight and allow flexion and extension of the lower back, with little rotation. They have large kidney-shaped bodies and short, thick, hatchet-shaped spinous processes, and they lack foramina transversaria and costal facets.\n"}, {"structure_id": "spine.lumbar_region", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "In adults the spinal cord usually ends at about the L1-L2 level (conus medullaris). Below this the vertebral canal contains the cauda equina, so lumbar puncture is performed between L3 and L4 or between L4 and L5, away from the cord.\n"}, {"structure_id": "spine.sacral_region", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The sacrum is a triangular bone formed by the fusion of five sacral vertebrae (S1-S5). It articulates superiorly with L5 at the lumbosacral joint, laterally with the ilia at the sacroiliac joints, and inferiorly with the coccyx. It transmits body weight to the pelvic girdle. Anterior and posterior sacral foramina transmit the rami of the sacral spinal nerves.\n"}, {"structure_id": "spine.coccygeal_region", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The coccyx (tailbone) is a small triangular bone usually formed by four fused rudimentary vertebrae, although three to five occur. It articulates with the apex of the sacrum. It gives attachment to parts of the gluteus maximus and coccygeus muscles and to the anococcygeal ligament, and it supports the pelvic floor.\n"}, {"structure_id": "spine.intervertebral_disc", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "Intervertebral discs join adjacent vertebral bodies from C2-C3 down to L5-S1. There is no disc between the skull and C1 or between C1 and C2. Each disc has an outer annulus fibrosus of fibrocartilage lamellae and an inner gelatinous nucleus pulposus. Together they absorb shock and allow movement. Discs make up about a quarter of the length of the presacral column.\n"}, {"structure_id": "spine.intervertebral_disc", "review_status": "APPROVED", "source"   });
  grid.querySelectorAll(".pill").forEach(p => {
    const open = e => { e.stopPropagation(); showChunk(p.dataset.loc, +p.dataset.idx); };
    p.onclick = open; p.onkeydown = e => { if (e.key === "Enter" || e.key === " ") open(e); };
  });
  grid.querySelectorAll(".cell").forEach(c => {
    const col = [...c.parentNode.children].indexOf(c) % (cols.length + 1);
    setTimeout(() => c.classList.add("in"), reduced ? 0 : (+c.dataset.row) * 60 + col * 90);
  });
  requestAnimationFrame(() => drawWires(true));
}
const name = sid => (pack.structures.find(s => s.id === sid) || { en: sid }).en;

function highlightCol(key, on) {
  document.querySelectorAll(`#grid [data-col="${CSS.escape(key)}"]`).forEach(e => e.classList.toggle("colhl", on));
}

const pt = (e, side) => {
  const b = $("#board").getBoundingClientRect(), r = e.getBoundingClientRect();
  return { x: (side === "l" ? r.left : side === "r" ? r.right : r.left + r.width / 2) - b.left, y: r.top + r.height / 2 - b.top };
};
function path(d, cls, parent, delay, animate) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d); p.setAttribute("class", cls);
  parent.appendChild(p);
  if (animate && !reduced) {
    const len = p.getTotalLength();
    p.style.strokeDasharray = `${len}`; p.style.strokeDashoffset = `${len}`;
    p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset .6s ease ${delay}ms`;
    p.style.strokeDashoffset = "0";
    p.addEventListener("transitionend", () => { p.style.strokeDasharray = ""; p.style.strokeDashoffset = ""; p.style.transition = ""; }, { once: true });
  }
  return p;
}
function drawWires(animate = false) {
  const g = $("#wireG"); g.innerHTML = "";
  const board = $("#board"), svg = $("#wires");
  svg.setAttribute("width", board.scrollWidth); svg.setAttribute("height", board.scrollHeight);
  const o = pt($("#fanOrigin"), "c");
  const rows = pack.structures.length;
  for (let r = 0; r < rows; r++) {
    const cells = [...document.querySelectorAll(`#grid .cell[data-row="${r}"]`)];
    const sid = pack.structures[r].id;
    const a = pt(cells[0], "l");
    const mx = o.x + (a.x - o.x) * .55;
    path(`M${o.x},${o.y} C${mx},${o.y} ${mx},${a.y} ${a.x},${a.y}`, "wire fan" + (sid === sel ? " sel" : ""), g, r * 60, animate);
    for (let i = 0; i < cells.length - 1; i++) {
      const p1 = pt(cells[i], "r"), p2 = pt(cells[i + 1], "l");
      const gap = cells[i + 1].classList.contains("gap") || cells[i].classList.contains("gap");
      path(`M${p1.x},${p1.y} L${p2.x},${p2.y}`, `wire${gap ? " gapw" : ""}${sid === sel ? " sel" : ""}`, g, 300 + r * 60 + i * 90, animate);
    }
  }
  drawArcs();
}

function relationsOf(sid) {
  const out = [], seen = new Set();
  pack.structures.forEach(s => Object.entries(s.relations).forEach(([rel, ts]) => ts.forEach(t => {
    if (s.id !== sid && t !== sid) return;
    const other = s.id === sid ? t : s.id;
    const key = DIRECTED.has(rel) ? `${rel}|${s.id}|${t}` : `${rel}|${[s.id, t].sort()}`;
    if (!seen.has(key) && pack.structures.some(x => x.id === other)) { seen.add(key); out.push({ rel, from: s.id, to: t, other }); }
  })));
  return out;
}
function drawArcs() {
  const g = $("#arcG"), defs = $("#defs"); g.innerHTML = "";
  const focus = sel || hover;
  $("#board").classList.toggle("focus", !!focus);
  $("#grid").classList.toggle("focus", !!sel);
  document.querySelectorAll("#grid .cell").forEach(c => c.classList.remove("row-sel", "row-rel"));
  if (!focus) return;
  const rels = relationsOf(focus);
  const rowOf = sid => pack.structures.findIndex(s => s.id === sid);
  document.querySelectorAll(`#grid .cell[data-row="${rowOf(focus)}"]`).forEach(c => c.classList.add("row-sel"));
  rels.forEach(r => $(`#grid .cell.st[data-sid="${CSS.escape(r.other)}"]`)?.classList.add("row-rel"));
  const stCell = sid => $(`#grid .cell.st[data-sid="${CSS.escape(sid)}"]`);
  const perOther = {};
  rels.forEach(r => {
    if (!defs.querySelector(`#ah-${r.rel}`)) {
      defs.insertAdjacentHTML("beforeend", `<marker id="ah-${r.rel}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${relVar(r.rel)}"/></marker>`);
    }
    const k = perOther[r.other] = (perOther[r.other] || 0) + 1;
    const a = pt(stCell(r.from), "l"), b = pt(stCell(r.to), "l");
    a.x -= 2; b.x -= 4;
    const bulge = Math.min(50, 14 + Math.abs(b.y - a.y) * .08) + (k - 1) * 9;
    const cx = Math.min(a.x, b.x) - bulge;
    const p = path(`M${a.x},${a.y} C${cx},${a.y} ${cx},${b.y} ${b.x},${b.y}`, "arc", g, 0, true);
    p.style.stroke = relVar(r.rel);
    if (r.rel === "part_of") p.setAttribute("stroke-dasharray", "5 4");
    if (DIRECTED.has(r.rel)) p.setAttribute("marker-end", `url(#ah-${r.rel})`);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", cx + 2); t.setAttribute("y", (a.y + b.y) / 2 + 3); t.setAttribute("class", "arc-label");
    t.setAttribute("text-anchor", "middle"); t.style.fill = relVar(r.rel);
    t.textContent = (REL_LABEL[r.rel] || r.rel).split(" ")[0];
    if (Math.abs(b.y - a.y) > 40 && rels.filter(x => x.other === r.other).length === 1) g.appendChild(t);
  });
}

function selectStructure(sid, scroll = false) {
  sel = sel === sid && !scroll ? null : sid;
  drawWires();
  if (!sel) return closeDrawer();
  if (scroll) $(`#grid .cell.st[data-sid="${CSS.escape(sid)}"]`)?.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
  const s = pack.structures.find(x => x.id === sid), h = pack.hotspots.find(x => x.structure_id === sid);
  const rels = relationsOf(sid);
  const checks = pack.checks.filter(c => c.sid === sid);
  openDrawer(`
    <h2>${esc(s.en)}</h2>${s.ar ? `<div dir="rtl" class="muted">${esc(s.ar)}</div>` : ""}
    <div class="mono muted">${esc(s.id)}</div>
    <h3>Checks</h3><ul class="checks">${checks.map(c => `<li><span class="tag ${c.level}">${c.level}</span><span>${esc(c.msg)}</span></li>`).join("")
      || '<li><span class="tag ok">ok</span><span>All references resolve</span></li>'}</ul>
    <h3>Relations · structures.yaml</h3><ul class="rels">${rels.map(r => `<li>
      <span class="mono" style="color:${relVar(r.rel)}">${r.from === sid ? "→" : "←"} ${esc(REL_LABEL[r.rel] || r.rel)}</span>
      <a class="jump" data-sid="${esc(r.other)}">${esc(name(r.other))}</a></li>`).join("") || '<li class="muted">none (root concept)</li>'}</ul>
    <h3>3D · ${esc(pack.glb || "GLB")} + hotspots.yaml</h3>
    <dl class="mono"><dt>mesh_name</dt><dd>${esc(s.mesh ?? "null")}</dd>
      <dt>position</dt><dd>${esc(h?.position ?? "—")}</dd><dt>normal</dt><dd>${esc(h?.normal ?? "—")}</dd></dl>
    <h3>Knowledge</h3><ul class="rels">${locales.map(l => pack.knowledge[l].map((c, i) => ({ ...c, i })).filter(c => c.structure_id === sid)
      .map(c => `<li><a class="jump" data-loc="${l}" data-idx="${c.i}">${l} #${c.i + 1}</a>
        <span class="tag ${c.review_status === "APPROVED" ? "ok" : "warn"}">${esc(c.review_status)}</span>
        <span class="muted">${esc(c.text.slice(0, 70))}…</span></li>`).join("")).join("") || '<li class="muted">none</li>'}</ul>
    <h3>Aliases · OntologyResolver</h3><div class="chips">${s.aliases.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>`);
}
function showChunk(loc, idx) {
  const c = pack.knowledge[loc][idx];
  sel = c.structure_id; drawWires();
  openDrawer(`
    <h2>knowledge.${esc(loc)}.yaml #${idx + 1}</h2>
    <div class="muted">for <a class="jump" data-sid="${esc(c.structure_id)}">${esc(name(c.structure_id))}</a></div>
    <dl class="mono"><dt>status</dt><dd>${esc(c.review_status)}</dd><dt>source</dt><dd>${esc(c.source)}</dd>
      <dt>version</dt><dd>${esc(c.source_version)}</dd><dt>reviewer</dt><dd>${esc(c.reviewer ?? "—")}</dd></dl>
    <h3>Text</h3><div class="text" dir="${loc === "ar" ? "rtl" : "ltr"}" lang="${esc(loc)}">${esc(c.text.trim())}</div>`);
}
function openDrawer(html) {
  const d = $("#drawer");
  d.innerHTML = `<button class="close" aria-label="Close">✕</button>` + html;
  d.classList.add("open");
  d.querySelector(".close").onclick = () => { sel = null; closeDrawer(); drawWires(); };
  d.querySelectorAll("a.jump").forEach(a => a.onclick = () =>
    a.dataset.loc ? showChunk(a.dataset.loc, +a.dataset.idx) : selectStructure(a.dataset.sid, true));
}
function closeDrawer() { $("#drawer").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && sel) { sel = null; closeDrawer(); drawWires(); } });

DATA.forEach((p, i) => {
  const b = document.createElement("button");
  b.textContent = p.lesson.title; b.onclick = () => load(i);
  $("#tabs").appendChild(b);
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => pack && drawWires(), 80); });
const linked = decodeURIComponent(location.hash.slice(1));
const linkedPack = DATA.findIndex(p => p.structures.some(s => s.id === linked));
if (linkedPack >= 0) { load(linkedPack); setTimeout(() => selectStructure(linked, true), reduced ? 0 : 700); }
else if (DATA.length) load(0); else document.body.insertAdjacentHTML("beforeend", "<p style='padding:16px'>No lesson packs found.</p>");
</script>
</body>
</html>
