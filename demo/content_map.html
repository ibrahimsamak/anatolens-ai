<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnatoLens Content Map</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --sunk: #efeee9; --ink: #1d1f24; --muted: #6b6f78; --line: #dcdad3;
  --accent: #c2410c; --accent-soft: #fde7da; --wire: #b9b6ad;
  --ok: #2f7d4f; --ok-soft: #e1f2e7; --warn: #a86400; --warn-soft: #fbefd9; --err: #b42318; --err-soft: #fde4e1;
  --info: #44607f; --info-soft: #e3ebf4;
  --rel-part_of: #8a8f99; --rel-connects_to: #2f6fb3; --rel-flows_to: #c0392b; --rel-supplies: #7a4fb8; --rel-other: #3f8f6b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --surface: #1b1e24; --sunk: #16181d; --ink: #e8e9ec; --muted: #9aa0ab; --line: #2c3038;
    --accent: #ff8a4c; --accent-soft: #3a2418; --wire: #4a4f59;
    --ok: #5cc08a; --ok-soft: #173123; --warn: #e0a040; --warn-soft: #362a12; --err: #f07167; --err-soft: #3a1c1a;
    --info: #8fb0d6; --info-soft: #1c2735;
    --rel-part_of: #7d838e; --rel-connects_to: #5b9be0; --rel-flows_to: #ef6b5b; --rel-supplies: #a884e0; --rel-other: #5cc095;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1b1e24; --sunk: #16181d; --ink: #e8e9ec; --muted: #9aa0ab; --line: #2c3038;
  --accent: #ff8a4c; --accent-soft: #3a2418; --wire: #4a4f59;
  --ok: #5cc08a; --ok-soft: #173123; --warn: #e0a040; --warn-soft: #362a12; --err: #f07167; --err-soft: #3a1c1a;
  --info: #8fb0d6; --info-soft: #1c2735;
  --rel-part_of: #7d838e; --rel-connects_to: #5b9be0; --rel-flows_to: #ef6b5b; --rel-supplies: #a884e0; --rel-other: #5cc095;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; }
.muted { color: var(--muted); }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center;
         padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
h1 { font-size: 16px; margin: 0; }
h1 span { color: var(--muted); font-weight: 400; }
.group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--line);
         border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, .cell:focus-visible, .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 16px; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
#summary { display: flex; gap: 6px; flex-wrap: wrap; }
.stat { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--sunk); }

#scroller { overflow-x: auto; padding: 20px 16px 40px; }
#board { position: relative; display: flex; gap: 28px; width: max-content; min-width: 100%; }
#wires { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

#side { width: 260px; flex: none; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
#lessonCard { position: relative; }
#lessonCard img { width: 100%; max-height: 150px; object-fit: contain; background: var(--sunk); border-radius: 6px; margin-bottom: 8px; }
#lessonCard h2 { margin: 0; font-size: 17px; }
#fanOrigin { position: absolute; right: -5px; top: 50%; width: 10px; height: 10px; border-radius: 50%;
             background: var(--accent); }
dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; font-size: 12px; }
dt { color: var(--muted); } dd { margin: 0; word-break: break-all; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
ul.files, ul.checks { list-style: none; margin: 0; padding: 0; }
ul.files li { padding: 6px 8px; border-radius: 6px; cursor: default; border: 1px solid transparent; }
ul.files li:hover, ul.files li.hl { background: var(--sunk); border-color: var(--line); }
ul.files li .use { font-size: 11px; color: var(--muted); display: block; }
ul.files li.missing { opacity: .55; } ul.files li.missing .mono { text-decoration: line-through; }
ul.checks li { display: flex; gap: 6px; padding: 4px 0; font-size: 12px; border-top: 1px solid var(--line); }
ul.checks li:first-child { border-top: 0; }
ul.checks li[data-sid] { cursor: pointer; }
.tag { font-size: 10px; font-weight: 600; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; height: fit-content; flex: none; }
.tag.error { background: var(--err-soft); color: var(--err); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.info { background: var(--info-soft); color: var(--info); } .tag.ok { background: var(--ok-soft); color: var(--ok); }

#grid { display: grid; gap: 8px 22px; align-content: start; }
.hd { font-weight: 600; font-size: 13px; padding: 0 2px 4px; border-bottom: 2px solid var(--line); transition: border-color .2s; }
.hd small { display: block; font-weight: 400; color: var(--muted); }
.hd.gutter { border: 0; }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 58px;
        opacity: 0; transition: opacity .35s, border-color .2s, background .2s; }
.cell.in { opacity: 1; }
.cell.gap { background: transparent; border-style: dashed; color: var(--muted); font-size: 12px; display: flex; align-items: center; }
.cell.gap.warn { border-color: var(--warn); color: var(--warn); }
.cell.st { cursor: pointer; position: relative; }
.cell.st .name { font-weight: 600; }
.cell.st .ar { direction: rtl; color: var(--muted); font-size: 12px; }
.cell.st .badge { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; }
.badge.error { background: var(--err); } .badge.warn { background: var(--warn); }
.cell.clickable { cursor: pointer; }
.ok-t { color: var(--ok); } .err-t { color: var(--err); } .warn-t { color: var(--warn); }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { font-size: 11px; border-radius: 999px; padding: 1px 8px; cursor: pointer; border: 1px solid transparent; }
.pill.APPROVED { background: var(--ok-soft); color: var(--ok); }
.pill:not(.APPROVED) { background: var(--warn-soft); color: var(--warn); }
.pill:hover { border-color: currentColor; }
.colhl { border-color: var(--accent) !important; }
.hd.colhl { border-bottom-color: var(--accent) !important; }
#grid.focus .cell:not(.row-sel):not(.row-rel) { opacity: .35; }
.cell.row-sel { border-color: var(--accent); background: var(--accent-soft); }
.cell.st.row-rel { border-color: var(--ink); }

.wire { fill: none; stroke: var(--wire); stroke-width: 1.5; transition: opacity .25s; }
.wire.gapw { stroke-dasharray: 3 4; }
.wire.fan { stroke: var(--accent); opacity: .35; }
#board.focus .wire { opacity: .15; }
#board.focus .wire.sel { opacity: 1; stroke: var(--accent); stroke-width: 2; }
.arc { fill: none; stroke-width: 2; }
.arc-label { font-size: 10px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }

#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--surface);
          border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.12); z-index: 10;
          transform: translateX(105%); transition: transform .3s ease; overflow-y: auto; padding: 18px; }
#drawer.open { transform: none; }
#drawer .close { float: right; }
#drawer h2 { margin: 0 0 2px; font-size: 18px; }
#drawer h3 { margin-top: 18px; }
#drawer .text { white-space: pre-wrap; line-height: 1.6; background: var(--sunk); border-radius: 8px; padding: 12px; }
#drawer .text[dir="rtl"] { font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
ul.rels { list-style: none; padding: 0; margin: 0; }
ul.rels li { padding: 3px 0; }
a.jump { color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); }
@media (prefers-reduced-motion: reduce) { .cell, #drawer, .wire { transition: none; } }
@media (max-width: 700px) { #side { width: 220px; } }
</style>
</head>

structure_id": "digestive.cecum", "mesh_name": "Digestive_Cecum", "position": "-0.0536m 0.1325m 0.0319m", "normal": "0.45 0.1004 0.8873"}, {"structure_id": "digestive.appendix", "mesh_name": "Digestive_Appendix", "position": "-0.0807m 0.1189m 0.0129m", "normal": "-0.3424 -0.4744 0.811"}, {"structure_id": "digestive.ascending_colon", "mesh_name": "Digestive_AscendingColon", "position": "-0.0849m 0.1778m 0.0254m", "normal": "-0.0023 0.0326 0.9995"}, {"structure_id": "digestive.transverse_colon", "mesh_name": "Digestive_TransverseColon", "position": "0.0142m 0.2631m 0.0887m", "normal": "-0.0391 0.4654 0.8842"}, {"structure_id": "digestive.descending_colon", "mesh_name": "Digestive_DescendingColon", "position": "0.0883m 0.1517m 0.0272m", "normal": "-0.1267 0.2911 0.9483"}, {"structure_id": "digestive.rectum", "mesh_name": "Digestive_Rectum", "position": "0.0017m 0.0746m -0.0385m", "normal": "0.1011 -0.1518 0.9832"}, {"structure_id": "digestive.liver", "mesh_name": "Digestive_Liver", "position": "0.0244m 0.3663m 0.0956m", "normal": "0.0013 -0.0126 0.9999"}, {"structure_id": "digestive.gallbladder", "mesh_name": "Digestive_Gallbladder", "position": "-0.0411m 0.3082m 0.0696m", "normal": "0.1176 0.5759 0.809"}, {"structure_id": "digestive.bile_ducts", "mesh_name": "Digestive_BileDucts", "position": "-0.0176m 0.3334m 0.035m", "normal": "0.312 -0.4489 0.8374"}, {"structure_id": "digestive.pancreas", "mesh_name": "Digestive_Pancreas", "position": "0.0023m 0.2845m 0.0395m", "normal": "-0.0803 -0.0048 0.9968"}], "knowledge": {"ar": [{"structure_id": "digestive.digestive_system", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يتكوّن الجهاز الهضمي من القناة الهضمية، وهي أنبوب متصل يمتد من الفم عبر البلعوم والمريء والمعدة والأمعاء الدقيقة والأمعاء الغليظة حتى الشرج، ومن أعضاء ملحقة هي الغدد اللعابية والكبد والمرارة والبنكرياس. يتناول الطعام ويفتّته ميكانيكيًا وكيميائيًا، ويمتص المغذيات والماء، ويطرح البقايا غير المهضومة.\n"}, {"structure_id": "digestive.digestive_system", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يتألف جدار القناة الهضمية من المريء حتى القناة الشرجية من أربع طبقات: المخاطية وتحت المخاطية والطبقة العضلية الخارجية ثم المصلية أو البرانية. وتدفع موجات الانقباض في الطبقة العضلية (التمعّج) المحتويات إلى الأمام، بتحكّم من الجهاز العصبي المعوي وبتعديل من الأعصاب الذاتية وهرمونات الأمعاء.\n"}, {"structure_id": "digestive.esophagus", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "المريء أنبوب عضلي طوله نحو 25 سم، ينقل الطعام من البلعوم (عند مستوى الفقرة C6) إلى المعدة. ينزل خلف الرغامى والقلب، ويعبر الحجاب الحاجز من الفرجة المريئية عند مستوى الفقرة T10 تقريبًا. ثلثه العلوي عضلات هيكلية، وثلثه السفلي عضلات ملساء، وثلثه الأوسط مزيج منهما. وتتحكم مصرّتان مريئيتان علوية وسفلية في مرور الطعام وتساعدان على منع ارتجاع محتويات المعدة.\n"}, {"structure_id": "digestive.stomach", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "المعدة أوسع أجزاء القناة الهضمية، وتقع في الغالب في الجزء العلوي الأيسر من البطن. لها فؤاد وقاع وجسم وجزء بوابي، وانحناءان صغير وكبير. تفرز الغدد المعدية حمض الهيدروكلوريك والعامل الداخلي (الخلايا الجدارية) ومولّد الببسين (الخلايا الرئيسية). تخزّن المعدة الطعام وتمزجه حتى يصبح كيموسًا شبه سائل، وتنظّم المصرّة البوابية تفريغه إلى الاثني عشر.\n"}, {"structure_id": "digestive.duodenum", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "الاثنا عشر (العفج) هو الجزء الأول والأقصر من الأمعاء الدقيقة، وطوله نحو 25 سم. يلتف على شكل حرف C حول رأس البنكرياس، وله أربعة أجزاء: علوي ونازل وأفقي وصاعد. تنفتح القناة الصفراوية المشتركة والقناة البنكرياسية الرئيسية في الجزء النازل عند الحليمة الاثني عشرية الكبرى، فتختلط الصفراء وإنزيمات البنكرياس بالكيموس هنا. وينتهي عند الثنية الاثني عشرية الصائمية.\n"}, {"structure_id": "digestive.jejunum", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يشكّل الصائم نحو الخُمسين القريبين من الأمعاء الدقيقة بعد الاثني عشر، ويقع غالبًا في الجزء العلوي الأيسر من البطن معلّقًا بالمساريقا. مقارنة باللفائفي، تجويفه أوسع وجداره أثخن وثنياته الدائرية عالية ومتقاربة، وأوعيته المستقيمة طويلة وأقواسه الشريانية قليلة. وهو الموضع الرئيسي لامتصاص المغذيات.\n"}, {"structure_id": "digestive.ileum", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يشكّل اللفائفي الأخماس الثلاثة البعيدة من الأمعاء الدقيقة، ويقع غالبًا في الجزء السفلي الأيمن من البطن وفي الحوض. جداره أرق وثنياته الدائرية أقل، وتحمل مساريقاه أقواسًا شريانية أكثر بأوعية مستقيمة قصيرة. وتبرز فيه العقيدات اللمفاوية المتجمعة (لطخات باير). يمتص اللفائفي الانتهائي فيتامين B12 والأملاح الصفراوية، وينتهي عند الموصل اللفائفي الأعوري.\n"}, {"structure_id": "digestive.cecum", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "الأعور جيب مسدود النهاية في بداية الأمعاء الغليظة، يقع في الحفرة الحرقفية اليمنى تحت مستوى الموصل اللفائفي الأعوري. ينفتح فيه اللفائفي عبر الفتحة اللفائفية الأعورية التي تحدّ ثنياتها الشبيهة بالصمام من الارتجاع. تنشأ الزائدة الدودية من جداره الخلفي الإنسي، ويستمر صعودًا بالقولون الصاعد.\n"}, {"structure_id": "digestive.appendix", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "الزائدة الدودية أنبوب ضيق مسدود النهاية، طوله عادة 6-10 سم، ينشأ من الجدار الخلفي الإنسي للأعور حيث تلتقي الشرائط القولونية الثلاثة. يختلف موضعها، وأشيعها خلف الأعور. جدارها غني بالنسيج اللمفاوي. ويُعلَّم موضع قاعدتها على الجلد تقليديًا بنقطة ماكبرني، على ثلث المسافة من الشوكة الحرقفية الأمامية العلوية إلى السرة؛ والتهابها هو التهاب الزائدة الدودية.\n"}, {"structure_id": "digestive.ascending_colon", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يصعد القولون الصاعد في الجانب الأيمن من البطن من الأعور إلى الثنية القولونية اليمنى (الكبدية) تحت الكبد، وهو عادة خلف الصفاق. وكسائر القولون يظهر فيه ثلاثة شرائط عضلية طولية (الشرائط القولونية) وتكيّسات (الأكياس القولونية) وزوائد ثربية دهنية. يمتص القولون الماء والكهارل، فيحوّل المحتويات السائلة إلى براز.\n"}, {"structure_id": "digestive.transverse_colon", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يعبر القولون المستعرض البطن من الثنية القولونية اليمنى إلى الثنية القولونية اليسرى (الطحالية). وهو أطول أجزاء الأمعاء الغليظة وأكثرها حركة، معلّق بمساريقا القولون المستعرض، وكثيرًا ما يتدلى إلى ما دون مستوى العرفين الحرقفيين. ثلثاه القريبان من المعي المتوسط (الشريان القولوني الأوسط) وثلثه البعيد من المعي الخلفي (فروع الشريان المساريقي السفلي).\n"}, {"structure_id": "digestive.descending_colon", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "ينزل القولون النازل في الجانب الأيسر من البطن من الثنية القولونية اليسرى إلى حافة الحوض، حيث يصبح القولون السيني. وهو خلف الصفاق، ويغذّيه الشريان القولوني الأيسر من الشريان المساريقي السفلي. ومع مرور المحتويات فيه يزداد البراز صلابة بامتصاص الماء.\n"}, {"structure_id": "digestive.sigmoid_colon", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "القولون السيني عروة على شكل حرف S تمتد من حافة الحوض إلى المستقيم عند مستوى الفقرة S3 تقريبًا. يتعلق بمساريقا خاصة به هي مساريقا القولون السيني، مما يجعله متحركًا، وتغذّيه الشرايين السينية. وهو موضع شائع للرتوج، وقد يلتف حول مساريقاه (انفتال القولون السيني).\n"}, {"structure_id": "digestive.rectum", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يمتد المستقيم من القولون السيني عند مستوى الفقرة S3 تقريبًا إلى الموصل الشرجي المستقيمي، وطوله نحو 12 سم، ويتبع انحناء العجز. تنتشر فيه الشرائط القولونية لتكوّن طبقة عضلية متصلة، فلا توجد فيه أكياس قولونية ولا زوائد ثربية. ويحتفظ جزؤه السفلي المتوسع، الأمبولة المستقيمية، بالبراز حتى التغوّط.\n"}, {"structure_id": "digestive.anal_canal", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "القناة الشرجية هي آخر 3-4 سم من القناة الهضمية، تمتد من الموصل الشرجي المستقيمي، حيث تشكّل العضلة العانية المستقيمية حمّالة، إلى فتحة الشرج. تحيط بها مصرّة شرجية داخلية لاإرادية من عضلات ملساء ومصرّة شرجية خارجية إرادية من عضلات هيكلية. ويقسمها الخط المشطي إلى جزء علوي وجزء سفلي يختلفان في التروية الدموية والتصريف اللمفاوي والتعصيب.\n"}, {"structure_id": "digestive.liver", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "الكبد أكبر غدة في الجسم، وزنه نحو 1.5 كغ، ويقع في الجزء العلوي الأيمن من البطن تحت الحجاب الحاجز. له تروية دموية مزدوجة: نحو ثلاثة أرباعها من الوريد البابي الكبدي الحامل للدم الغني بالمغذيات من الأمعاء، والباقي من الشريان الكبدي. ويغادر الدم عبر الأوردة الكبدية إلى الوريد الأجوف السفلي. ينتج الكبد الصفراء، ويعالج المغذيات الممتصة، ويصنع بروتينات البلازما، ويخزّن الغليكوجين والفيتامينات، ويزيل سمية الأدوية والفضلات الاستقلابية.\n"}, {"structure_id": "digestive.liver", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "للكبد تشريحيًا فصوص أيمن وأيسر ومذنّب ومربّع. ووظيفيًا يُقسم إلى ثماني قطع (قطع كوينو)، لكل منها فرع خاص من الوريد البابي والشريان الكبدي والقناة الصفراوية، مما يتيح للجرّاحين استئصال قطع منفردة.\n"}, {"structure_id": "digestive.gallbladder", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "المرارة كيس كمّثري الشكل يقع في حفرة على السطح الحشوي للكبد، ولها قاع وجسم وعنق. تخزّن الصفراء وتركّزها، وتتسع لنحو 30-50 مل. بعد وجبة دسمة يجعلها هرمون الكوليسيستوكينين تنقبض فتطلق الصفراء عبر القناة المرارية والقناة الصفراوية المشتركة إلى الاثني عشر. وقد تتكوّن الحصوات المرارية عندما تصبح الصفراء فوق مشبعة.\n"}, {"structure_id": "digestive.bile_ducts", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "تصرّف القناتان الكبديتان اليمنى واليسرى الصفراء من الكبد وتتحدان لتكوّنا القناة الكبدية المشتركة. تنضم إليها القناة المرارية القادمة من المرارة لتكوّنا القناة الصفراوية المشتركة، التي تمر خلف الاثني عشر وعبر رأس البنكرياس. وتلتقي عادة بالقناة البنكرياسية الرئيسية عند الأمبولة الكبدية البنكرياسية التي تنفتح في الاثني عشر عند الحليمة الاثني عشرية الكبرى، وتحرسها مصرّة أودي.\n"}, {"structure_id": "digestive.pancreas", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "البنكرياس غدة خلف الصفاق تقع خلف المعدة. يستقر رأسه داخل انحناء الاثني عشر، وتمتد عنقه وجسمه وذيله إلى اليسار نحو الطحال. وبوصفه غدة خارجية الإفراز يفرز إنزيمات هاضمة (مثل مولّد التربسين والأميلاز والليباز) والبيكربونات إلى الاثني عشر عبر القناة البنكرياسية الرئيسية. وبوصفه غدة صماء تفرز جزر لانغرهانس فيه الإنسولين والغلوكاغون في الدم.\n"}], "en": [{"structure_id": "digestive.digestive_system", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The digestive system consists of the alimentary (gastrointestinal) tract, a continuous tube running from the mouth through the pharynx, esophagus, stomach, small intestine and large intestine to the anus, together with accessory organs: the salivary glands, liver, gallbladder and pancreas. It ingests food, breaks it down mechanically and chemically, absorbs nutrients and water, and eliminates the undigested residue.\n"}, {"structure_id": "digestive.digestive_system", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "From the esophagus to the anal canal the wall of the gut has four layers: mucosa, submucosa, muscularis externa and an outer serosa or adventitia. Waves of contraction in the muscularis (peristalsis) move the contents along, controlled by the enteric nervous system and modified by autonomic nerves and gut hormones.\n"}, {"structure_id": "digestive.esophagus", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The esophagus is a muscular tube about 25 cm long that carries food from the pharynx (at the level of C6) to the stomach. It descends behind the trachea and heart and passes through the esophageal hiatus of the diaphragm at about T10. Its upper third is skeletal muscle, its lower third smooth muscle, and the middle third a mixture. An upper and a lower esophageal sphincter control entry and help prevent reflux of gastric contents.\n"}, {"structure_id": "digestive.stomach", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The stomach is the widest part of the alimentary tract, lying mainly in the left upper abdomen. It has a cardia, fundus, body and pyloric part, with lesser and greater curvatures. Gastric glands secrete hydrochloric acid and intrinsic factor (parietal cells) and pepsinogen (chief cells). The stomach stores and churns food into semi-liquid chyme, and the pyloric sphincter regulates its emptying into the duodenum.\n"}, {"structure_id": "digestive.duodenum", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The duodenum is the first and shortest part of the small intestine, about 25 cm long. It forms a C-shaped curve around the head of the pancreas in four parts: superior, descending, horizontal and ascending. The common bile duct and main pancreatic duct open into the descending part at the major duodenal papilla, so bile and pancreatic enzymes mix with chyme here. It ends at the duodenojejunal flexure.\n"}, {"structure_id": "digestive.jejunum", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The jejunum forms roughly the proximal two-fifths of the small intestine beyond the duodenum and lies mostly in the left upper abdomen, suspended by the mesentery. Compared with the ileum it has a wider lumen, a thicker wall, tall closely packed circular folds, long vasa recta and few arterial arcades. It is the main site of nutrient absorption.\n"}, {"structure_id": "digestive.ileum", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The ileum forms the distal three-fifths of the small intestine and lies mainly in the lower right abdomen and pelvis. Its wall is thinner, its circular folds fewer, and its mesentery carries more arterial arcades with short vasa recta. Aggregated lymphoid nodules (Peyer's patches) are prominent. The terminal ileum absorbs vitamin B12 and bile salts, and the ileum ends at the ileocecal junction.\n"}, {"structure_id": "digestive.cecum", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The cecum is the blind-ended pouch at the start of the large intestine, lying in the right iliac fossa below the level of the ileocecal junction. The ileum opens into it at the ileocecal orifice, whose valve-like folds limit backflow. The appendix arises from its posteromedial wall, and it continues upward as the ascending colon.\n"}, {"structure_id": "digestive.appendix", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The vermiform appendix is a narrow blind-ended tube, usually 6-10 cm long, arising from the posteromedial wall of the cecum where the three taeniae coli converge. Its position varies, retrocecal being the most common. Its wall is rich in lymphoid tissue. The base of the appendix is classically marked on the skin at McBurney's point, one third of the way from the anterior superior iliac spine to the umbilicus; inflammation of the appendix is appendicitis.\n"}, {"structure_id": "digestive.ascending_colon", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The ascending colon runs up the right side of the abdomen from the cecum to the right colic (hepatic) flexure beneath the liver, and is usually retroperitoneal. Like the rest of the colon it shows three longitudinal muscle bands (taeniae coli), sacculations (haustra) and fatty omental appendices. The colon absorbs water and electrolytes, turning liquid contents into feces.\n"}, {"structure_id": "digestive.transverse_colon", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The transverse colon crosses the abdomen from the right colic flexure to the left colic (splenic) flexure. It is the longest and most mobile part of the large intestine, suspended by the transverse mesocolon, and often hangs down below the level of the iliac crests. Its proximal two-thirds belong to the midgut (middle colic artery) and its distal third to the hindgut (inferior mesenteric artery branches).\n"}, {"structure_id": "digestive.descending_colon", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The descending colon runs down the left side of the abdomen from the left colic flexure to the pelvic brim, where it becomes the sigmoid colon. It is retroperitoneal and is supplied by the left colic artery, a branch of the inferior mesenteric artery. As contents pass through it, water absorption makes the stool progressively firmer.\n"}, {"structure_id": "digestive.sigmoid_colon", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The sigmoid colon is an S-shaped loop that runs from the pelvic brim to the rectum at about the level of S3. It hangs on its own mesentery, the sigmoid mesocolon, which makes it mobile, and it is supplied by the sigmoid arteries. It is a common site of diverticula and can twist on its mesentery (sigmoid volvulus).\n"}, {"structure_id": "digestive.rectum", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The rectum continues from the sigmoid colon at about S3 to the anorectal junction, about 12 cm in length, following the curve of the sacrum. Here the taeniae coli spread out into a continuous muscle coat, so the rectum has no haustra or omental appendices. Its dilated lower part, the rectal ampulla, holds feces until defecation.\n"}, {"structure_id": "digestive.anal_canal", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The anal canal is the final 3-4 cm of the alimentary tract, running from the anorectal junction, where the puborectalis muscle forms a sling, to the anus. It is surrounded by an involuntary internal anal sphincter of smooth muscle and a voluntary external anal sphincter of skeletal muscle. The pectinate line divides it into upper and lower parts with different blood supply, lymph drainage and nerve supply.\n"}, {"structure_id": "digestive.liver", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The liver is the largest gland in the body, about 1.5 kg, lying in the right upper abdomen beneath the diaphragm. It receives a dual blood supply: about three-quarters from the hepatic portal vein, carrying nutrient-rich blood from the gut, and the rest from the hepatic artery. Blood leaves through the hepatic veins into the inferior vena cava. The liver produces bile, processes absorbed nutrients, makes plasma proteins, stores glycogen and vitamins, and detoxifies drugs and metabolites.\n"}, {"structure_id": "digestive.liver", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "Anatomically the liver has right, left, caudate and quadrate lobes. Functionally it is divided into eight segments (Couinaud segments), each with its own branch of the portal vein, hepatic artery and bile duct, which allows surgeons to remove individual segments.\n"}, {"structure_id": "digestive.gallbladder", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The gallbladder is a pear-shaped sac lying in a fossa on the visceral surface of the liver, with a fundus, body and neck. It stores and concentrates bile, holding about 30-50 mL. After a fatty meal the hormone cholecystokinin makes it contract, releasing bile through the cystic duct and common bile duct into the duodenum. Gallstones can form when bile becomes supersaturated.\n"}, {"structure_id": "digestive.bile_ducts", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The right and left hepatic ducts drain bile from the liver and unite to form the common hepatic duct. This is joined by the cystic duct from the gallbladder to form the common bile duct, which passes behind the duodenum and through the head of the pancreas. It usually joins the main pancreatic duct at the hepatopancreatic ampulla, which opens into the duodenum at the major duodenal papilla, guarded by the sphincter of Oddi.\n"}, {"structure_id": "digestive.pancreas", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The pancreas is a retroperitoneal gland lying behind the stomach. Its head sits within the curve of the duodenum, and its neck, body and tail extend to the left toward the spleen. As an exocrine gland it secretes digestive enzymes (such as trypsinogen, amylase and lipase) and bicarbonate into the duodenum through the main pancreatic duct. As an endocrine gland its islets of Langerhans release insulin and glucagon into the blood.\n"}]}, "checks": [{"level": "error", "msg": "knowledge.ar.yaml exists but ingest.py never loads it", "sid": null}, {"level": "info", "msg": "quiz.yaml not authored yet (quiz service (not built yet))", "sid": null}, {"level": "info", "msg": "mesh_name is null: no 3D hotspot", "sid": "digestive.digestive_system"}, {"level": "info", "msg": "mesh_name is null: no 3D hotspot", "sid": "digestive.sigmoid_colon"}, {"level": "info", "msg": "mesh_name is null: no 3D hotspot", "sid": "digestive.anal_canal"}, {"level": "info", "msg": "knowledge.ar.yaml: 20/20 chunks have reviewer pending (dev seed)", "sid": null}, {"level": "info", "msg": "knowledge.en.yaml: 20/20 chunks have reviewer pending (dev seed)", "sid": null}]}, {"dir": "heart", "lesson": {"id" 0.0537m", "normal": "-0.1669 -0.07 0.9835"}, {"structure_id": "heart.superior_vena_cava", "mesh_name": "Heart_SuperiorVenaCava", "position": "-0.0333m 0.1339m 0.0129m", "normal": "0.3428 -0.0288 0.939"}, {"structure_id": "heart.inferior_vena_cava", "mesh_name": "Heart_InferiorVenaCava", "position": "-0.033m 0.0115m 0.0123m", "normal": "0.388 -0.0133 0.9216"}], "knowledge": {"ar": [{"structure_id": "heart.heart", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "القلب مضخة عضلية تقع في المنصف الأوسط داخل التامور. له أربع حجرات: أذينان يستقبلان الدم وبطينان يضخّانه. يضخ الجانب الأيمن الدم غير المؤكسج إلى الرئتين (الدورة الرئوية)، ويضخ الجانب الأيسر الدم المؤكسج إلى الجسم (الدورة الجهازية).\n"}, {"structure_id": "heart.heart", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يسري الدم في القلب بالترتيب التالي: الوريدان الأجوفان، الأذين الأيمن، الصمام ثلاثي الشرف، البطين الأيمن، الصمام الرئوي، الجذع الرئوي، الرئتان، الأوردة الرئوية، الأذين الأيسر، الصمام التاجي، البطين الأيسر، الصمام الأبهري، الأبهر. تحافظ الصمامات الأربعة على جريان الدم في اتجاه واحد.\n"}, {"structure_id": "heart.right_atrium", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يستقبل الأذين الأيمن الدم غير المؤكسج من الوريد الأجوف العلوي والوريد الأجوف السفلي والجيب التاجي، ويمرّره عبر الصمام ثلاثي الشرف إلى البطين الأيمن. يحوي جداره العقدة الجيبية الأذينية، وهي ناظمة القلب الطبيعية. والحفرة البيضية على الحاجز بين الأذينين هي بقايا الثقبة البيضية الجنينية.\n"}, {"structure_id": "heart.right_ventricle", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يشكّل البطين الأيمن معظم السطح الأمامي للقلب، ويضخ الدم غير المؤكسج عبر الصمام الرئوي إلى الجذع الرئوي. جداره أرقّ من جدار البطين الأيسر لأن الدورة الرئوية منخفضة الضغط. وفي داخله تربيقات لحمية وعضلات حليمية والحزمة المعدِّلة.\n"}, {"structure_id": "heart.left_atrium", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يشكّل الأذين الأيسر معظم قاعدة القلب (سطحه الخلفي). يستقبل الدم المؤكسج من الرئتين عبر الأوردة الرئوية، وعددها عادةً أربعة، ويمرّره عبر الصمام التاجي إلى البطين الأيسر. ولقربه من المريء يمكن تصويره بتخطيط صدى القلب عبر المريء.\n"}, {"structure_id": "heart.left_ventricle", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يشكّل البطين الأيسر قمة القلب ومعظم سطحه الأيسر. جداره هو الأسمك بين الحجرات الأربع، وعادةً أسمك من جدار البطين الأيمن بمرتين إلى ثلاث، لأنه يضخ الدم المؤكسج عبر الصمام الأبهري إلى الدورة الجهازية عالية الضغط.\n"}, {"structure_id": "heart.tricuspid_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يقع الصمام ثلاثي الشرف (الصمام الأذيني البطيني الأيمن) بين الأذين الأيمن والبطين الأيمن. له ثلاث شُرَف (أمامية وخلفية وحاجزية) تثبّتها الحبال الوترية بالعضلات الحليمية، فتمنعها من الانقلاب نحو الأذين عند انقباض البطين.\n"}, {"structure_id": "heart.mitral_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يقع الصمام التاجي (ثنائي الشرف، الصمام الأذيني البطيني الأيسر) بين الأذين الأيسر والبطين الأيسر. له شرفتان، أمامية وخلفية، تثبّتهما الحبال الوترية بالعضلتين الحليميتين الأمامية الجانبية والخلفية الإنسية. ينغلق أثناء الانقباض البطيني ليمنع ارتجاع الدم إلى الأذين الأيسر.\n"}, {"structure_id": "heart.pulmonary_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "الصمام الرئوي صمام هلالي ذو ثلاث شُرَف عند ملتقى البطين الأيمن والجذع الرئوي. ينفتح أثناء الانقباض البطيني وينغلق أثناء الانبساط، فيمنع عودة الدم إلى البطين الأيمن.\n"}, {"structure_id": "heart.aortic_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "الصمام الأبهري صمام هلالي ذو ثلاث شُرَف (يمنى ويسرى وخلفية) بين البطين الأيسر والأبهر الصاعد. فوق الشُّرَف تقع الجيوب الأبهرية، ومن الجيبين الأيمن والأيسر ينشأ الشريانان التاجيان الأيمن والأيسر.\n"}, {"structure_id": "heart.aorta", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "الأبهر هو الشريان الرئيسي للدورة الجهازية. يبدأ عند الصمام الأبهري بالأبهر الصاعد، وفرعاه الوحيدان هما الشريانان التاجيان. يستمر بقوس الأبهر الذي يعطي الجذع العضدي الرأسي والشريان السباتي المشترك الأيسر والشريان تحت الترقوة الأيسر، ثم ينزل بوصفه الأبهر النازل (الصدري).\n"}, {"structure_id": "heart.pulmonary_trunk", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "ينقل الجذع الرئوي الدم غير المؤكسج من البطين الأيمن، ثم ينقسم إلى الشريانين الرئويين الأيمن والأيسر المتجهين إلى الرئتين. ويصل الرباط الشرياني، وهو بقايا القناة الشريانية الجنينية، بين الشريان الرئوي الأيسر وقوس الأبهر.\n"}, {"structure_id": "heart.coronary_arteries", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يغذّي الشريانان التاجيان الأيمن والأيسر عضلة القلب. ينقسم الشريان التاجي الأيسر إلى الفرع الأمامي بين البطينين (النازل الأمامي الأيسر) والفرع المنعطف. ويغذّي الشريان التاجي الأيمن عادةً العقدتين الجيبية الأذينية والأذينية البطينية، ويعطي لدى معظم الناس الفرع الخلفي بين البطينين. قد يؤدي انسداد أحد الشرايين التاجية إلى احتشاء عضلة القلب.\n"}, {"structure_id": "heart.cardiac_veins", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يعود معظم دم عضلة القلب عبر الأوردة القلبية التي تصب في الجيب التاجي، وهو يسير في الجزء الخلفي من الثلم التاجي ويفتح في الأذين الأيمن. أهم روافده الأوردة القلبية الكبيرة والمتوسطة والصغيرة، أما الأوردة القلبية الأمامية فتصب مباشرة في الأذين الأيمن.\n"}, {"structure_id": "heart.superior_vena_cava", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يعيد الوريد الأجوف العلوي الدم غير المؤكسج من الرأس والعنق والطرفين العلويين ومعظم جدار الصدر إلى الأذين الأيمن. يتكوّن من اتحاد الوريدين العضديين الرأسيين الأيمن والأيسر، ويستقبل الوريد الفرد قبل دخوله الأذين.\n"}, {"structure_id": "heart.inferior_vena_cava", "review_status": "APPROVED", "source": "Gray's Anatomy (ملخص تعليمي)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "يعيد الوريد الأجوف السفلي الدم غير المؤكسج من الطرفين السفليين والحوض والبطن إلى الأذين الأيمن. يتكوّن من اتحاد الوريدين الحرقفيين المشتركين، ويعبر الحجاب الحاجز عبر الفتحة الأجوفية عند مستوى الفقرة T8 تقريبًا. يُظهر النموذج فقط جزءه الانتهائي القصير الداخل إلى الأذين الأيمن.\n"}], "en": [{"structure_id": "heart.heart", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The heart is a muscular pump in the middle mediastinum, enclosed in the pericardium. It has four chambers: two atria that receive blood and two ventricles that pump it out. The right side pumps deoxygenated blood to the lungs (pulmonary circulation). The left side pumps oxygenated blood to the body (systemic circulation).\n"}, {"structure_id": "heart.heart", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "Blood flows through the heart in this order: venae cavae, right atrium, tricuspid valve, right ventricle, pulmonary valve, pulmonary trunk, lungs, pulmonary veins, left atrium, mitral valve, left ventricle, aortic valve, aorta. The four valves keep this flow in one direction.\n"}, {"structure_id": "heart.right_atrium", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The right atrium receives deoxygenated blood from the superior vena cava, the inferior vena cava and the coronary sinus, and passes it through the tricuspid valve to the right ventricle. Its wall contains the sinoatrial (SA) node, the heart's natural pacemaker. The fossa ovalis on the interatrial septum is the remnant of the fetal foramen ovale.\n"}, {"structure_id": "heart.right_ventricle", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The right ventricle forms most of the anterior surface of the heart. It pumps deoxygenated blood through the pulmonary valve into the pulmonary trunk. Its wall is thinner than the left ventricle's because the pulmonary circulation is a low-pressure system. Its interior has trabeculae carneae, papillary muscles and the septomarginal trabecula (moderator band).\n"}, {"structure_id": "heart.left_atrium", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The left atrium forms most of the base (posterior surface) of the heart. It receives oxygenated blood from the lungs, usually through four pulmonary veins, and passes it through the mitral valve to the left ventricle. Its close relation to the esophagus is the basis of transesophageal echocardiography.\n"}, {"structure_id": "heart.left_ventricle", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The left ventricle forms the apex of the heart and most of its left (pulmonary) surface. It has the thickest wall of the four chambers, typically two to three times thicker than the right ventricle's, because it pumps oxygenated blood through the aortic valve into the high-pressure systemic circulation.\n"}, {"structure_id": "heart.tricuspid_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The tricuspid (right atrioventricular) valve lies between the right atrium and the right ventricle. It has three leaflets (anterior, posterior and septal), anchored by chordae tendineae to papillary muscles. These stop the leaflets everting into the atrium when the ventricle contracts.\n"}, {"structure_id": "heart.mitral_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The mitral (bicuspid, left atrioventricular) valve lies between the left atrium and the left ventricle. It has two leaflets, anterior and posterior, held by chordae tendineae attached to the anterolateral and posteromedial papillary muscles. It closes during ventricular systole to prevent backflow into the left atrium.\n"}, {"structure_id": "heart.pulmonary_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The pulmonary valve is a semilunar valve with three cusps at the junction of the right ventricle and the pulmonary trunk. It opens during ventricular systole and closes during diastole, preventing blood from returning to the right ventricle.\n"}, {"structure_id": "heart.aortic_valve", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The aortic valve is a semilunar valve with three cusps (right, left and posterior) between the left ventricle and the ascending aorta. Above the cusps are the aortic sinuses; the right and left coronary arteries arise from the right and left aortic sinuses.\n"}, {"structure_id": "heart.aorta", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The aorta is the main artery of the systemic circulation. It begins at the aortic valve as the ascending aorta, whose only branches are the coronary arteries. It continues as the arch of the aorta, which gives off the brachiocephalic trunk, the left common carotid artery and the left subclavian artery, and then descends as the descending (thoracic) aorta.\n"}, {"structure_id": "heart.pulmonary_trunk", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The pulmonary trunk carries deoxygenated blood from the right ventricle and divides into the right and left pulmonary arteries, which run to the lungs. The ligamentum arteriosum, the remnant of the fetal ductus arteriosus, connects the left pulmonary artery to the arch of the aorta.\n"}, {"structure_id": "heart.coronary_arteries", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The right and left coronary arteries supply the myocardium. The left coronary artery divides into the anterior interventricular (left anterior descending) branch and the circumflex branch. The right coronary artery usually supplies the SA and AV nodes and, in most people, gives off the posterior interventricular branch. Blockage of a coronary artery can cause a myocardial infarction.\n"}, {"structure_id": "heart.cardiac_veins", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "Most blood from the myocardium returns through cardiac veins that drain into the coronary sinus, which runs in the posterior part of the coronary sulcus and opens into the right atrium. Its main tributaries are the great, middle and small cardiac veins. Anterior cardiac veins drain directly into the right atrium.\n"}, {"structure_id": "heart.superior_vena_cava", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The superior vena cava returns deoxygenated blood from the head, neck, upper limbs and most of the thoracic wall to the right atrium. It is formed by the union of the right and left brachiocephalic veins and receives the azygos vein before entering the atrium.\n"}, {"structure_id": "heart.inferior_vena_cava", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The inferior vena cava returns deoxygenated blood from the lower limbs, pelvis and abdomen to the right atrium. It is formed by the union of the common iliac veins and passes through the caval opening of the diaphragm at about the level of T8. The model shows only its short terminal segment entering the right atrium.\n"}]}, "checks": [{"level": "error", "msg": "knowledge.ar.yaml exists but ingest.py never loads it", "sid": null}, {"level": "info", "msg": "quiz.yaml not authored yet (quiz service (not built yet))", "sid": null}, {"level": "info", "msg": "mesh_name is null: no 3D hotspot", "sid": "heart.heart"}, {"level": "info", "msg": "knowledge.ar.yaml: 16/16 chunks have reviewer pending (dev seed)", "sid": null}, {"level": "info", "msg": "knowledge.en.yaml: 16/16 chunks have reviewer pending (dev seed)", "sid": null}]}, {"dir": "spine", "lesson": {"id": "spine_001", "title": "Vertebral Column", "system": "skeletal", "model_url": "/assets/spine.glb", "ios_model_url": "/assets/spine.usdz", "review_status": "APPROVED"}, ults the spinal cord usually ends at about the L1-L2 level (conus medullaris). Below this the vertebral canal contains the cauda equina, so lumbar puncture is performed between L3 and L4 or between L4 and L5, away from the cord.\n"}, {"structure_id": "spine.sacral_region", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The sacrum is a triangular bone formed by the fusion of five sacral vertebrae (S1-S5). It articulates superiorly with L5 at the lumbosacral joint, laterally with the ilia at the sacroiliac joints, and inferiorly with the coccyx. It transmits body weight to the pelvic girdle. Anterior and posterior sacral foramina transmit the rami of the sacral spinal nerves.\n"}, {"structure_id": "spine.coccygeal_region", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "The coccyx (tailbone) is a small triangular bone usually formed by four fused rudimentary vertebrae, although three to five occur. It articulates with the apex of the sacrum. It gives attachment to parts of the gluteus maximus and coccygeus muscles and to the anococcygeal ligament, and it supports the pelvic floor.\n"}, {"structure_id": "spine.intervertebral_disc", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "Intervertebral discs join adjacent vertebral bodies from C2-C3 down to L5-S1. There is no disc between the skull and C1 or between C1 and C2. Each disc has an outer annulus fibrosus of fibrocartilage lamellae and an inner gelatinous nucleus pulposus. Together they absorb shock and allow movement. Discs make up about a quarter of the length of the presacral column.\n"}, {"structure_id": "spine.intervertebral_disc", "review_status": "APPROVED", "source": "Gray's Anatomy (educational summary)", "source_version": "dev-seed-2026-10", "reviewer": "pending", "text": "A herniated disc occurs when the nucleus pulposus protrudes through a tear in the annulus fibrosus, usually posterolaterally, where it can compress a spinal nerve root. Herniations are most common in the lower lumbar region (L4-L5 and L5-S1).\n"}]}, "checks": [{"level": "error", "msg": "knowledge.ar.yaml exists but ingest.py never loads it", "sid": null}, {"level": "info", "msg": "quiz.yaml not authored yet (quiz service (not built yet))", "sid": null}, {"level": "info", "msg": "mesh_name is null: no 3D hotspot", "sid": "spine.vertebral_column"}, {"level": "info", "msg": "mesh_name is null: no 3D hotspot", "sid": "spine.coccygeal_region"}, {"level": "info", "msg": "knowledge.ar.yaml: 10/10 chunks have reviewer pending (dev seed)", "sid": null}, {"level": "info", "msg": "knowledge.en.yaml: 10/10 chunks have reviewer pending (dev seed)", "sid": null}]}];

  grid.querySelectorAll(".pill").forEach(p => {
    const open = e => { e.stopPropagation(); showChunk(p.dataset.loc, +p.dataset.idx); };
    p.onclick = open; p.onkeydown = e => { if (e.key === "Enter" || e.key === " ") open(e); };
  });
  grid.querySelectorAll(".cell").forEach(c => {
    const col = [...c.parentNode.children].indexOf(c) % (cols.length + 1);
    setTimeout(() => c.classList.add("in"), reduced ? 0 : (+c.dataset.row) * 60 + col * 90);
  });
  requestAnimationFrame(() => drawWires(true));
}
const name = sid => (pack.structures.find(s => s.id === sid) || { en: sid }).en;

function highlightCol(key, on) {
  document.querySelectorAll(`#grid [data-col="${CSS.escape(key)}"]`).forEach(e => e.classList.toggle("colhl", on));
}

const pt = (e, side) => {
  const b = $("#board").getBoundingClientRect(), r = e.getBoundingClientRect();
  return { x: (side === "l" ? r.left : side === "r" ? r.right : r.left + r.width / 2) - b.left, y: r.top + r.height / 2 - b.top };
};
function path(d, cls, parent, delay, animate) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d); p.setAttribute("class", cls);
  parent.appendChild(p);
  if (animate && !reduced) {
    const len = p.getTotalLength();
    p.style.strokeDasharray = `${len}`; p.style.strokeDashoffset = `${len}`;
    p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset .6s ease ${delay}ms`;
    p.style.strokeDashoffset = "0";
    p.addEventListener("transitionend", () => { p.style.strokeDasharray = ""; p.style.strokeDashoffset = ""; p.style.transition = ""; }, { once: true });
  }
  return p;
}
function drawWires(animate = false) {
  const g = $("#wireG"); g.innerHTML = "";
  const board = $("#board"), svg = $("#wires");
  svg.setAttribute("width", board.scrollWidth); svg.setAttribute("height", board.scrollHeight);
  const o = pt($("#fanOrigin"), "c");
  const rows = pack.structures.length;
  for (let r = 0; r < rows; r++) {
    const cells = [...document.querySelectorAll(`#grid .cell[data-row="${r}"]`)];
    const sid = pack.structures[r].id;
    const a = pt(cells[0], "l");
    const mx = o.x + (a.x - o.x) * .55;
    path(`M${o.x},${o.y} C${mx},${o.y} ${mx},${a.y} ${a.x},${a.y}`, "wire fan" + (sid === sel ? " sel" : ""), g, r * 60, animate);
    for (let i = 0; i < cells.length - 1; i++) {
      const p1 = pt(cells[i], "r"), p2 = pt(cells[i + 1], "l");
      const gap = cells[i + 1].classList.contains("gap") || cells[i].classList.contains("gap");
      path(`M${p1.x},${p1.y} L${p2.x},${p2.y}`, `wire${gap ? " gapw" : ""}${sid === sel ? " sel" : ""}`, g, 300 + r * 60 + i * 90, animate);
    }
  }
  drawArcs();
}

function relationsOf(sid) {
  const out = [], seen = new Set();
  pack.structures.forEach(s => Object.entries(s.relations).forEach(([rel, ts]) => ts.forEach(t => {
    if (s.id !== sid && t !== sid) return;
    const other = s.id === sid ? t : s.id;
    const key = DIRECTED.has(rel) ? `${rel}|${s.id}|${t}` : `${rel}|${[s.id, t].sort()}`;
    if (!seen.has(key) && pack.structures.some(x => x.id === other)) { seen.add(key); out.push({ rel, from: s.id, to: t, other }); }
  })));
  return out;
}
function drawArcs() {
  const g = $("#arcG"), defs = $("#defs"); g.innerHTML = "";
  const focus = sel || hover;
  $("#board").classList.toggle("focus", !!focus);
  $("#grid").classList.toggle("focus", !!sel);
  document.querySelectorAll("#grid .cell").forEach(c => c.classList.remove("row-sel", "row-rel"));
  if (!focus) return;
  const rels = relationsOf(focus);
  const rowOf = sid => pack.structures.findIndex(s => s.id === sid);
  document.querySelectorAll(`#grid .cell[data-row="${rowOf(focus)}"]`).forEach(c => c.classList.add("row-sel"));
  rels.forEach(r => $(`#grid .cell.st[data-sid="${CSS.escape(r.other)}"]`)?.classList.add("row-rel"));
  const stCell = sid => $(`#grid .cell.st[data-sid="${CSS.escape(sid)}"]`);
  const perOther = {};
  rels.forEach(r => {
    if (!defs.querySelector(`#ah-${r.rel}`)) {
      defs.insertAdjacentHTML("beforeend", `<marker id="ah-${r.rel}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${relVar(r.rel)}"/></marker>`);
    }
    const k = perOther[r.other] = (perOther[r.other] || 0) + 1;
    const a = pt(stCell(r.from), "l"), b = pt(stCell(r.to), "l");
    a.x -= 2; b.x -= 4;
    const bulge = Math.min(50, 14 + Math.abs(b.y - a.y) * .08) + (k - 1) * 9;
    const cx = Math.min(a.x, b.x) - bulge;
    const p = path(`M${a.x},${a.y} C${cx},${a.y} ${cx},${b.y} ${b.x},${b.y}`, "arc", g, 0, true);
    p.style.stroke = relVar(r.rel);
    if (r.rel === "part_of") p.setAttribute("stroke-dasharray", "5 4");
    if (DIRECTED.has(r.rel)) p.setAttribute("marker-end", `url(#ah-${r.rel})`);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", cx + 2); t.setAttribute("y", (a.y + b.y) / 2 + 3); t.setAttribute("class", "arc-label");
    t.setAttribute("text-anchor", "middle"); t.style.fill = relVar(r.rel);
    t.textContent = (REL_LABEL[r.rel] || r.rel).split(" ")[0];
    if (Math.abs(b.y - a.y) > 40 && rels.filter(x => x.other === r.other).length === 1) g.appendChild(t);
  });
}

function selectStructure(sid, scroll = false) {
  sel = sel === sid && !scroll ? null : sid;
  drawWires();
  if (!sel) return closeDrawer();
  if (scroll) $(`#grid .cell.st[data-sid="${CSS.escape(sid)}"]`)?.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
  const s = pack.structures.find(x => x.id === sid), h = pack.hotspots.find(x => x.structure_id === sid);
  const rels = relationsOf(sid);
  const checks = pack.checks.filter(c => c.sid === sid);
  openDrawer(`
    <h2>${esc(s.en)}</h2>${s.ar ? `<div dir="rtl" class="muted">${esc(s.ar)}</div>` : ""}
    <div class="mono muted">${esc(s.id)}</div>
    <h3>Checks</h3><ul class="checks">${checks.map(c => `<li><span class="tag ${c.level}">${c.level}</span><span>${esc(c.msg)}</span></li>`).join("")
      || '<li><span class="tag ok">ok</span><span>All references resolve</span></li>'}</ul>
    <h3>Relations · structures.yaml</h3><ul class="rels">${rels.map(r => `<li>
      <span class="mono" style="color:${relVar(r.rel)}">${r.from === sid ? "→" : "←"} ${esc(REL_LABEL[r.rel] || r.rel)}</span>
      <a class="jump" data-sid="${esc(r.other)}">${esc(name(r.other))}</a></li>`).join("") || '<li class="muted">none (root concept)</li>'}</ul>
    <h3>3D · ${esc(pack.glb || "GLB")} + hotspots.yaml</h3>
    <dl class="mono"><dt>mesh_name</dt><dd>${esc(s.mesh ?? "null")}</dd>
      <dt>position</dt><dd>${esc(h?.position ?? "—")}</dd><dt>normal</dt><dd>${esc(h?.normal ?? "—")}</dd></dl>
    <h3>Knowledge</h3><ul class="rels">${locales.map(l => pack.knowledge[l].map((c, i) => ({ ...c, i })).filter(c => c.structure_id === sid)
      .map(c => `<li><a class="jump" data-loc="${l}" data-idx="${c.i}">${l} #${c.i + 1}</a>
        <span class="tag ${c.review_status === "APPROVED" ? "ok" : "warn"}">${esc(c.review_status)}</span>
        <span class="muted">${esc(c.text.slice(0, 70))}…</span></li>`).join("")).join("") || '<li class="muted">none</li>'}</ul>
    <h3>Aliases · OntologyResolver</h3><div class="chips">${s.aliases.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</div>`);
}
function showChunk(loc, idx) {
  const c = pack.knowledge[loc][idx];
  sel = c.structure_id; drawWires();
  openDrawer(`
    <h2>knowledge.${esc(loc)}.yaml #${idx + 1}</h2>
    <div class="muted">for <a class="jump" data-sid="${esc(c.structure_id)}">${esc(name(c.structure_id))}</a></div>
    <dl class="mono"><dt>status</dt><dd>${esc(c.review_status)}</dd><dt>source</dt><dd>${esc(c.source)}</dd>
      <dt>version</dt><dd>${esc(c.source_version)}</dd><dt>reviewer</dt><dd>${esc(c.reviewer ?? "—")}</dd></dl>
    <h3>Text</h3><div class="text" dir="${loc === "ar" ? "rtl" : "ltr"}" lang="${esc(loc)}">${esc(c.text.trim())}</div>`);
}
function openDrawer(html) {
  const d = $("#drawer");
  d.innerHTML = `<button class="close" aria-label="Close">✕</button>` + html;
  d.classList.add("open");
  d.querySelector(".close").onclick = () => { sel = null; closeDrawer(); drawWires(); };
  d.querySelectorAll("a.jump").forEach(a => a.onclick = () =>
    a.dataset.loc ? showChunk(a.dataset.loc, +a.dataset.idx) : selectStructure(a.dataset.sid, true));
}
function closeDrawer() { $("#drawer").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && sel) { sel = null; closeDrawer(); drawWires(); } });

DATA.forEach((p, i) => {
  const b = document.createElement("button");
  b.textContent = p.lesson.title; b.onclick = () => load(i);
  $("#tabs").appendChild(b);
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => pack && drawWires(), 80); });
const linked = decodeURIComponent(location.hash.slice(1));
const linkedPack = DATA.findIndex(p => p.structures.some(s => s.id === linked));
if (linkedPack >= 0) { load(linkedPack); setTimeout(() => selectStructure(linked, true), reduced ? 0 : 700); }
else if (DATA.length) load(0); else document.body.insertAdjacentHTML("beforeend", "<p style='padding:16px'>No lesson packs found.</p>");
</script>
</body>
</html>
