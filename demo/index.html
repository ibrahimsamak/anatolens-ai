<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnatoLens Demo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffc400'/%3E%3Cstop offset='.5' stop-color='%23e10600'/%3E%3Cstop offset='1' stop-color='%23111'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='url(%23g)' stroke-width='15'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header>
    <h1><span class="logo" aria-hidden="true"></span>AnatoLens</h1>
    <label class="lesson-pick">
      <span class="visually-hidden">Lesson</span>
      <select id="lesson-select" aria-label="Choose a lesson"><option>Loading…</option></select>
    </label>
    <div class="actions">
      <a id="results-link" class="btn" href="/results.html">My results</a>
      <button id="scan-btn" type="button">Scan</button>
      <button id="ar-btn" type="button" hidden></button>
    </div>
  </header>
  <main>
    <section id="stage">
      <video id="camera" playsinline muted hidden></video>
      <div id="scan" hidden>
        <video id="scan-video" playsinline muted></video>
        <div class="scan-frame" aria-hidden="true"></div>
        <div class="scan-bar">
          <p id="scan-status" role="status">Point the camera at a lesson page</p>
          <div class="row">
            <button id="scan-capture" type="button">Capture</button>
            <label class="file-btn">Upload photo<input id="scan-file" class="visually-hidden" type="file" accept="image/*"></label>
            <button id="scan-open" type="button" hidden>Open lesson</button>
            <button id="scan-close" type="button">Cancel</button>
          </div>
        </div>
      </div>
      <model-viewer id="mv" camera-controls touch-action="pan-y" shadow-intensity="0.6"
          ar ar-modes="webxr scene-viewer quick-look" interaction-prompt="none" alt="3D anatomy model">
        <button slot="ar-button" hidden></button>
      </model-viewer>
      <p id="lesson-status" role="status">Loading lesson…</p>
    </section>
    <section id="side">
      <h2>Structures</h2>
      <div id="panel" class="chips"></div>
      <form id="ask" hidden>
        <label for="question">Ask about <b id="ask-target"></b></label>
        <div class="row">
          <input id="question" placeholder="e.g. what does it do?" autocomplete="off">
          <button type="submit">Ask</button>
        </div>
      </form>
      <article id="card" hidden aria-live="polite">
        <h3 id="card-title"></h3>
        <p id="card-text"></p>
        <small id="card-meta"></small>
      </article>
      <h2 class="spaced">Quiz</h2>
      <button id="quiz-btn" type="button">Quiz me</button>
      <article id="quiz" hidden aria-live="polite">
        <small id="quiz-meta"></small>
        <p id="quiz-prompt"></p>
        <div id="quiz-choices" class="choices"></div>
        <p id="quiz-feedback" role="status"></p>
        <button id="quiz-next" type="button" hidden>Next question</button>
        <ul id="quiz-progress"></ul>
      </article>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
