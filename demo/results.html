<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnatoLens Results</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffc400'/%3E%3Cstop offset='.5' stop-color='%23e10600'/%3E%3Cstop offset='1' stop-color='%23111'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='url(%23g)' stroke-width='15'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header>
    <h1><span class="logo" aria-hidden="true"></span>AnatoLens <span>· My results</span></h1>
    <div class="actions">
      <a id="back-link" class="btn" href="/">Back to lesson</a>
    </div>
  </header>
  <div class="results">
    <p id="results-status" role="status">Loading your results…</p>

    <section class="tiles" aria-label="Overall">
      <div class="tile"><small>Overall grade</small><b id="t-grade">–</b></div>
      <div class="tile"><small>Score</small><b id="t-score">–</b></div>
      <div class="tile"><small>Correct</small><b id="t-correct">–</b></div>
      <div class="tile"><small>Questions answered</small><b id="t-total">–</b></div>
    </section>

    <h2>Grades by lesson</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Lesson</th><th class="num">Answered</th><th class="num">Correct</th><th class="num">Score</th><th>Grade</th></tr></thead>
        <tbody id="lessons-body"></tbody>
      </table>
    </div>

    <h2>Mastery by structure</h2>
    <ul id="mastery" class="mastery"></ul>

    <h2>Quiz history</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date</th><th>Lesson</th><th>Question</th><th>Correct answer</th><th>Result</th></tr></thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
  </div>
  <script type="module" src="/src/results.ts"></script>
</body>
</html>
