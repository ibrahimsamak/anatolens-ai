services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: anatolens
      POSTGRES_PASSWORD: anatolens
      POSTGRES_DB: anatolens
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports: ["5001:5000"]
    volumes: ["mlflowdata:/mlflow"]

  neo4j:
    image: neo4j:5
    environment: { NEO4J_AUTH: "neo4j/anatolens" }
    ports: ["7474:7474", "7687:7687"]

volumes:
  pgdata:
  mlflowdata: